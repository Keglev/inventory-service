# =============================================================================
# nginx.conf - main context of the frontend image's nginx
# Usage: frontend/Dockerfile copies it to /etc/nginx/nginx.conf; it includes
#        conf.d/*.conf, which is ops/nginx/default.conf.
# Produces: an unprivileged master (no user directive: the image starts nginx
#        as uid 101, so there is no root to drop), logs on stderr, the pid file
#        in /tmp, gzip for text types and relative redirects.
# Failure mode: a syntax error stops nginx at container start, and the CI
#        contract gate (verify-image-contract.sh) fails the image before push.
# =============================================================================
worker_processes auto;

# stderr, so the platform captures the log.
error_log /dev/stderr info;
# /tmp because the unprivileged master cannot write /var/run.
pid       /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Slightly larger proxy buffers for JSON
  proxy_buffers 16 16k;
  proxy_buffer_size 16k;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # The only gzip_types list: one in default.conf would replace it, not extend it.
  gzip on;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css application/javascript text/javascript
    application/json application/xml text/xml image/svg+xml;

  # Make redirects relative (no :8080, no http://)
  absolute_redirect off;
  server_name_in_redirect off;
  port_in_redirect off;

  include /etc/nginx/conf.d/*.conf;
}
