# -----------------------------------------------------------------------------
# Smart Supply Pro — Frontend (Vite SPA) : Nginx vhost
# Purpose:
#   - Serve the compiled SPA and static assets on port 8080
#   - Proxy OAuth2 and API requests to the Spring backend (Hetzner, via Caddy)
#   - Ensure SPA fallback for client-side routing
#   - Cache content-hashed assets for a year, images for a day; revalidate
#     index.html and the locale files on every load
#   - Send baseline security headers (HSTS included) on responses served from
#     this image, and redirect plain-http visitors to https
#   - Redirect the bare apex to the canonical www host (ADR-0010)
# -----------------------------------------------------------------------------
server {
  listen 8080 default_server;
  server_name _;

  # Root directory produced by the Vite build stage
  root   /usr/share/nginx/html;
  index  index.html;

  # TLS ends at the Koyeb edge, so nginx itself only ever sees http; the edge
  # reports the visitor's scheme in X-Forwarded-Proto. Until this redirect,
  # http://www answered 200 with the whole app (FW6 survey, 2026-10-09), which
  # let anyone on the path inject script on a first plain-http visit. Only the
  # literal value "http" redirects: a request without the header (the image
  # HEALTHCHECK, the CI contract gate on 127.0.0.1) is served as before, so a
  # platform that stopped sending the header would lose the redirect, never
  # loop. A server-level `if` holding only `return` is the safe use of `if`.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  # Baseline security headers, once for every response this image serves.
  # add_header alone does not accumulate: a location declaring any add_header
  # (Cache-Control, the CSP) dropped all five, so they were repeated in six
  # locations (FO4). add_header_inherit merge (nginx 1.29.3+, image 1.30)
  # appends these to a location's own headers instead; the mode itself is
  # inherited by every location. The proxied locations below set it to off:
  # the backend sends its own security headers (HSTS for the API host comes
  # from Spring Security), and these would arrive twice.
  # HSTS (one year, this host only) tells the browser to use https for every
  # later visit, so the redirect above is needed only once; that redirect
  # carries these headers too, and a browser ignores HSTS sent over http.
  add_header_inherit merge;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Rewrite the build-time backend host (baked into the bundle from VITE_API_BASE)
  # to the FE origin, so the browser calls Koyeb same-origin and Nginx proxies to
  # the backend server-side. Load-bearing while VITE_API_BASE holds an absolute URL.
  # To retire: set VITE_API_BASE to a relative "/api" and remove this filter, and
  # rework httpClient's blank-value fallback, which is "/api" and would send the
  # OAuth2 init URL to /api/oauth2/authorization/google, matching no location here.
  # text/html is implicit in sub_filter_types; listing it makes nginx -t warn.
  # Compression is configured once, in nginx.conf: a gzip_types line here would
  # replace that list for this server, not extend it.
  # Both JavaScript types are listed although nginx has mapped .js to
  # application/javascript since 1.5.4 and still does on master (checked
  # 2026-09-01 across release-1.20.2 to release-1.29.0). The type is chosen by
  # whatever serves these bytes, not by this repo, and a filter matching only the
  # type in use today would stop rewriting in silence if that ever changed.
  # frontend-deploy.yml asserts on every deploy that the rewrite ran.
  sub_filter_once off;
  sub_filter_types application/javascript text/javascript;
  sub_filter "https://api.smartsupplypro.de" "https://$host";

  # Verify the API's certificate on the proxied hop. nginx's default is
  # proxy_ssl_verify off, which accepted any certificate between Koyeb and the
  # API, and session cookies and OAuth codes cross that hop. Set once at server
  # level, unlike the headers below, so every location inherits it and a new
  # https location cannot forget it. Depth 2, measured 2026-10-15: the API sends
  # leaf <- Let's Encrypt YE2 <- ISRG Root YE (cross-signed by ISRG Root X2);
  # against Alpine 3.24's bundle, which trusts X1 and X2 but not Root YE, the
  # chain verifies at depth 2 and fails at nginx's default of 1. The bundle is
  # the ca-certificates package the Dockerfile installs. Failure mode: a chain
  # that no longer verifies answers 502 on every proxied path, and the error
  # log names the cause ("upstream SSL certificate verify error").
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 2;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

  # Shared proxy headers are repeated per-location by choice: each auth/API path is
  # self-contained and independently auditable. proxy_redirect differs per location
  # (off for /api/, rewritten elsewhere), so a shared snippet would not fully apply.
  # ---------------------------------------------------------------------------
  # OAuth2 INIT (frontend → backend)
  # Example: GET /oauth2/authorization/google
  # MUST be proxied to the backend, not handled by SPA.
  # ---------------------------------------------------------------------------
  location ^~ /oauth2/authorization/ {
    add_header_inherit off;  # proxied: the backend sets its own security headers
    proxy_pass https://api.smartsupplypro.de;

    proxy_ssl_server_name on;
    proxy_ssl_name api.smartsupplypro.de;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Upstream sees real backend host
    proxy_set_header Host api.smartsupplypro.de;

    # Forward original FE host and HTTPS scheme/port (TLS terminated at Koyeb)
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Make backend-issued cookies first-party on the FE domain
    proxy_cookie_domain api.smartsupplypro.de $host;

    # Normalize absolute redirects back to FE. The backend already answers with
    # www URLs (probed 2026-10-09), so this line is a guard for a backend
    # config change. The :8080 variants and the matching sub_filter, written
    # before Caddy fronted the backend, matched nothing on the live OAuth,
    # callback, /api/me and logout flows and were removed (FW6 R6).
    proxy_redirect https://api.smartsupplypro.de/ https://$host/;
  }

  # ---------------------------------------------------------------------------
  # OAuth2 CALLBACK (Google → backend → FE)
  # Example: GET /login/oauth2/code/google
  # MUST be proxied so backend can finalize session & set cookies.
  # ---------------------------------------------------------------------------
  location ^~ /login/oauth2/ {
    add_header_inherit off;  # proxied: the backend sets its own security headers
    proxy_pass https://api.smartsupplypro.de;

    proxy_ssl_server_name on;
    proxy_ssl_name api.smartsupplypro.de;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host api.smartsupplypro.de;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_cookie_domain api.smartsupplypro.de $host;

    proxy_redirect https://api.smartsupplypro.de/ https://$host/;
  }

  # ---------------------------------------------------------------------------
  # LOGOUT (frontend → backend)  — exact match so SPA routes aren't swallowed
  # ---------------------------------------------------------------------------
  location = /logout {
    add_header_inherit off;  # proxied: the backend sets its own security headers
    # Only the logout form's POST goes to the backend. Any other method (a
    # reload or a typed URL) would get Spring's English confirmation page and
    # a new session; it gets the app shell instead, whose /logout route posts
    # the real logout. rewrite ... last is one of the two directives that are
    # safe inside an if in a location block.
    if ($request_method != POST) {
      rewrite ^ /index.html last;
    }

    proxy_pass https://api.smartsupplypro.de/logout;

    proxy_ssl_server_name on;
    proxy_ssl_name api.smartsupplypro.de;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host api.smartsupplypro.de;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_cookie_domain api.smartsupplypro.de $host;

    proxy_redirect https://api.smartsupplypro.de/ https://$host/;
  }

  # ---------------------------------------------------------------------------
  # API reverse proxy (same-origin)
  # Frontend calls /api/* → Nginx → https://api.smartsupplypro.de/*
  # ---------------------------------------------------------------------------
  location ^~ /api/ {
    add_header_inherit off;  # proxied: the backend sets its own security headers
    proxy_pass https://api.smartsupplypro.de;

    proxy_ssl_server_name on;
    proxy_ssl_name api.smartsupplypro.de;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host api.smartsupplypro.de;   # backend host
    proxy_set_header X-Forwarded-Host $host;          # original FE host
    proxy_set_header X-Forwarded-Proto https;         # force original scheme
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_cookie_domain api.smartsupplypro.de $host;

    # APIs shouldn't redirect; disable rewrite logic here
    proxy_redirect off;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    client_max_body_size 2m;
  }

  # ---- SPA fallback ----------------------------------------------------------
  # IMPORTANT: keep this below the proxy locations so auth/API don't hit SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ---- Static assets (content-hashed) ---------------------------------------
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # ---- Locale files (revalidated on every load) -----------------------------
  # The i18n loadPath carries no version, so a deploy that adds keys reaches a
  # returning browser only if it revalidates. Without Cache-Control the browser
  # applied heuristic freshness (a share of the time since Last-Modified) and
  # could show raw keys for hours. no-cache keeps the copy but asks first; the
  # ETag turns an unchanged file into a 304. A missing file is a 404, not the
  # app shell, so i18next reports it instead of parsing HTML as JSON.
  location /locales/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  # ---- Images and favicon (stable names, one day) ---------------------------
  # Not content-hashed, so a long lifetime would pin an old picture. One day
  # bounds staleness after a redesign and stops the edge and browser from
  # guessing a lifetime from Last-Modified.
  location /images/ {
    try_files $uri =404;
    expires 1d;
  }

  location = /favicon.svg {
    expires 1d;
  }

  # ---- App shell (never cached) ---------------------------------------------
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    # The page's own CSP, enforced since 2026-10-09 after it ran report-only
    # (#302) with no report on the live demo walk (FW6 S2). Every SPA route
    # and the GET of /logout end here, so this one location covers the app.
    # 'unsafe-inline' for styles only: MUI/emotion injects <style> tags at
    # runtime. No 'unsafe-eval': the one eval probe found (zod) is switched
    # off in config/zodConfig.ts. Same origin for everything else, because the
    # API, the OAuth start and the locale files all go through this host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  }
}

# ---- Bare apex -> canonical host ---------------------------------------------
# The apex reaches this image through a flattened CNAME (an INWX ALIAS record)
# to the Koyeb edge, because the registrar's own URL forwarding answers http
# only and fails every https request. The apex must not serve the app: the
# CORS allow-list, the OAuth2 redirect URI and APP_FRONTEND_BASE_URL name the
# www host only (ADR-0010), so the SPA would load there and then fail at login
# and on every write. Every other host, including the koyeb.app name and
# 127.0.0.1 in CI, still falls to the default server above.
# verify-image-contract.sh asserts this redirect and that www is not caught.
server {
  listen 8080;
  server_name smartsupplypro.de;
  return 301 https://www.smartsupplypro.de$request_uri;
}
