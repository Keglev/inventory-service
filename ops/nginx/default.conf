# =============================================================================
# default.conf - the frontend image's server blocks (Vite SPA on port 8080)
# Usage: frontend/Dockerfile copies it to /etc/nginx/conf.d/; nginx.conf
#        includes it. The reasons behind each rule ("Nginx delivery rules"):
#        docs/frontend/architecture/07-deployment.md.
# Produces: the SPA with its fallback for client-side routes; OAuth2, logout and
#        /api proxied to the backend (Hetzner, behind Caddy); content-hashed
#        assets cached a year, images a day, index.html and the locale files
#        revalidated on every load; the security headers, HSTS and the page's
#        CSP; plain http redirected to https; the bare apex redirected to www
#        (backend ADR-0010).
# Failure mode: a syntax error stops nginx at container start; a regression in
#        the headers, redirects or caching fails the CI contract gate
#        (verify-image-contract.sh); a broken upstream chain answers 502.
# =============================================================================
server {
  listen 8080 default_server;
  server_name _;

  # Root directory produced by the Vite build stage
  root   /usr/share/nginx/html;
  index  index.html;

  # TLS ends at the Koyeb edge, which reports the visitor's scheme in
  # X-Forwarded-Proto. Only the literal "http" redirects, so a request without the
  # header (HEALTHCHECK, CI gate) is served; a server-level `if` with `return` is safe.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  # Security headers for every response (frontend ADR-0011): add_header_inherit merge
  # (nginx 1.29.3+) adds them to a location's own headers; the proxied locations set
  # it off, the backend sends its own. HSTS: one year, this host only.
  add_header_inherit merge;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Serve-time API-base rewrite (backend ADR-0008): the baked backend host becomes the
  # page's host, so the browser stays same-origin. Both JavaScript types, so a MIME
  # change cannot stop it silently; text/html is implicit. frontend-deploy.yml checks it.
  sub_filter_once off;
  sub_filter_types application/javascript text/javascript;
  sub_filter "https://api.smartsupplypro.de" "https://$host";

  # Verify the API's certificate: session cookies and OAuth codes cross this hop.
  # Server level, so every location inherits it. Depth 2 fits the API's chain against
  # Alpine's bundle; a chain that stops verifying answers 502 (07-deployment.md).
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 2;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

  # Shared proxy headers are repeated per-location by choice: each auth/API path is
  # self-contained and independently auditable. proxy_redirect differs per location
  # (off for /api/, rewritten elsewhere), so a shared snippet would not fully apply.

  # OAuth2 init (GET /oauth2/authorization/google) goes to the backend, never the SPA.
  location ^~ /oauth2/authorization/ {
    add_header_inherit off;  # proxied: the backend sets its own security headers
    proxy_pass https://api.smartsupplypro.de;

    proxy_ssl_server_name on;
    proxy_ssl_name api.smartsupplypro.de;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Upstream sees real backend host
    proxy_set_header Host api.smartsupplypro.de;

    # Forward original FE host and HTTPS scheme/port (TLS terminated at Koyeb)
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Make backend-issued cookies first-party on the FE domain
    proxy_cookie_domain api.smartsupplypro.de $host;

    # A guard: the backend already answers with www URLs; an absolute redirect to
    # the API host would come back to the page's host.
    proxy_redirect https://api.smartsupplypro.de/ https://$host/;
  }

  # OAuth2 callback (GET /login/oauth2/code/google): the backend finalises the session.
  location ^~ /login/oauth2/ {
    add_header_inherit off;  # proxied: the backend sets its own security headers
    proxy_pass https://api.smartsupplypro.de;

    proxy_ssl_server_name on;
    proxy_ssl_name api.smartsupplypro.de;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host api.smartsupplypro.de;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_cookie_domain api.smartsupplypro.de $host;

    proxy_redirect https://api.smartsupplypro.de/ https://$host/;
  }

  # Logout: an exact match, so no SPA route is swallowed.
  location = /logout {
    add_header_inherit off;  # proxied: the backend sets its own security headers
    # Only the form's POST reaches the backend; a GET would get Spring's English
    # confirmation page, so it gets the app shell, whose /logout route posts.
    # rewrite ... last is safe inside a location's if.
    if ($request_method != POST) {
      rewrite ^ /index.html last;
    }

    proxy_pass https://api.smartsupplypro.de/logout;

    proxy_ssl_server_name on;
    proxy_ssl_name api.smartsupplypro.de;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host api.smartsupplypro.de;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_cookie_domain api.smartsupplypro.de $host;

    proxy_redirect https://api.smartsupplypro.de/ https://$host/;
  }

  # API reverse proxy: /api/* -> https://api.smartsupplypro.de/api/*.
  location ^~ /api/ {
    add_header_inherit off;  # proxied: the backend sets its own security headers
    proxy_pass https://api.smartsupplypro.de;

    proxy_ssl_server_name on;
    proxy_ssl_name api.smartsupplypro.de;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host api.smartsupplypro.de;   # backend host
    proxy_set_header X-Forwarded-Host $host;          # original FE host
    proxy_set_header X-Forwarded-Proto https;         # force original scheme
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_cookie_domain api.smartsupplypro.de $host;

    # APIs shouldn't redirect; disable rewrite logic here
    proxy_redirect off;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    client_max_body_size 2m;
  }

  # SPA fallback. The shortest prefix: every longer prefix and exact match in this
  # file wins over it, whatever the order.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets: content-hashed names, so a year and immutable.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # Locale files, revalidated on every load: the loadPath has no version, so a
  # returning browser must ask (ETag -> 304) or shows raw keys after a deploy. A
  # missing file is a 404, not the app shell, so i18next reports it.
  location /locales/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  # Images and favicon: stable names, so one day bounds staleness after a redesign
  # and stops the edge and the browser guessing a lifetime from Last-Modified.
  location /images/ {
    try_files $uri =404;
    expires 1d;
  }

  location = /favicon.svg {
    expires 1d;
  }

  # App shell: never cached.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    # The page's CSP; every SPA route and the GET of /logout end here. Inline styles
    # only (emotion injects <style>); no eval (config/zodConfig.ts turns off zod's
    # probe); 'self' for the rest: API, OAuth start and locales use this host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  }
}

# Bare apex -> canonical host (backend ADR-0010). The apex must not serve the app:
# CORS, the OAuth2 redirect URI and APP_FRONTEND_BASE_URL name www only. Every other
# host falls to the default server; verify-image-contract.sh asserts both.
server {
  listen 8080;
  server_name smartsupplypro.de;
  return 301 https://www.smartsupplypro.de$request_uri;
}
