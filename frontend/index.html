<!--
  Vite's build entry point — the bundler starts here to resolve the module graph.
  React mounts into #root; the script tag must use type="module" for ES module loading.
  The meta description is German because the app is German-first (i18n/index.ts).
-->
<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Supply Pro</title>
    <meta name="description" content="Smart Supply Pro – Demo einer Lagerverwaltung mit Java/Spring Boot und React: Bestand, Lieferanten und Analytik." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
