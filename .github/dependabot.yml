# =============================================================================
# dependabot.yml - version updates for the actions, Maven, npm and Docker
#
# Four ecosystems: the pinned actions, the Maven build, the frontend's npm
# tree and the base images in the two Dockerfiles. Every action is pinned to a
# commit, and a pin nobody updates goes stale; Dependabot rewrites both the
# commit and the trailing version comment, which is why the comments are there.
#
# The frontend audit and Trivy detect known vulnerabilities but never move a
# version, so Maven and npm are here for bug-fix releases. Vulnerabilities are
# covered separately by Dependabot security updates, a repository setting that
# opens a pull request when an advisory hits a dependency, outside this
# schedule and outside the limits below.
#
# Monthly, one grouped pull request per ecosystem, at most one open at a time,
# so a batch is small enough to diagnose when CI turns red. Maven and npm take
# minor and patch releases only: a major version is a migration planned by
# hand (Spring Boot 4, React 19), not a bot update. The restriction sits in
# `allow`, whose update-types apply to version updates only, so a security
# update that needs a major version still arrives. In every ecosystem a
# release must be seven days old before it is proposed, time for a compromised
# version to be caught and pulled; security updates skip that wait.
#
# Docker: every base tag floats
# (3-eclipse-temurin-21, 21-jre-alpine, 24-bookworm-slim, 1.30-alpine) and is
# pulled fresh on every build; Dependabot could only move them to a new major
# or minor, which the allow rule keeps for a person to plan. nginx minors are
# ignored because odd minors are nginx's mainline branch; the maven image is
# ignored because Dependabot changed its JDK suffix (see the ignore below).
#
# No labels: generated release notes group by pull request label, this
# repository does not label pull requests, and the release workflow depends on
# that.
# =============================================================================
version: 2

updates:
  # "/" is the repository root, where Dependabot finds .github/workflows. The
  # composite actions under .github/actions pin their own actions, so they are
  # listed too.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: []
    commit-message:
      # Conventional Commits, so the generated release notes stay readable.
      prefix: ci
    # The same seven days as the other ecosystems. Actions are where a
    # hijacked release tag did harm (the trivy-action tag attack): a pin moved
    # within hours of a compromised release would carry it into every job.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: []
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      maven:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: []
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      npm:
        patterns:
          - "*"

  # Both Dockerfiles: the backend image at the root, the nginx image in frontend/.
  - package-ecosystem: docker
    directories:
      - /
      - /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: []
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    ignore:
      - dependency-name: nginx
        update-types:
          - version-update:semver-minor
      # The tag carries the JDK as a suffix (3-eclipse-temurin-21), and Dependabot
      # swapped it to Temurin 26 despite the minor/patch rule. It floats and is pulled
      # fresh, so ignoring it loses nothing; a JDK change is made by hand.
      - dependency-name: maven
    groups:
      docker:
        patterns:
          - "*"
