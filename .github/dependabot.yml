# =============================================================================
# Smart Supply Pro - Dependabot
#
# Four ecosystems: the pinned actions, the Maven build, the frontend's npm
# tree and the base images in the two Dockerfiles. Every action is pinned to a commit, and a pin nobody updates is how the
# Koyeb CLI fallback ended up four major versions stale; Dependabot rewrites
# both the commit and the trailing version comment, which is why the comments
# are there.
#
# Maven and npm were left out until 2026-09-24, on the ground that the
# frontend audit and Trivy already gate both trees. They detect known
# vulnerabilities; they never move a version, so bug-fix releases arrived only
# when someone edited the pom or package.json by hand. Vulnerabilities are
# covered separately by Dependabot security updates, a repository setting that
# opens a pull request when an advisory hits a dependency, outside this
# schedule and outside the limits below.
#
# Monthly, one grouped pull request per ecosystem, at most one open at a time,
# so a batch is small enough to diagnose when CI turns red. Maven and npm take
# minor and patch releases only: a major version is a migration planned by
# hand (Spring Boot 4, React 19), not a bot update. The restriction sits in
# `allow`, whose update-types apply to version updates only, so a security
# update that needs a major version still arrives. A release must be seven
# days old before it is proposed, time for a compromised version to be caught
# and pulled; security updates skip that wait.
#
# Docker was added on 2026-10-09 (FW6 C1). Every base tag floats
# (3-eclipse-temurin-21, 21-jre-alpine, 24-bookworm-slim, 1.30-alpine) and is
# pulled fresh on every build; Dependabot could only move them to a new major
# or minor, which the allow rule keeps for a person to plan. nginx minors are
# ignored because odd minors are nginx's mainline branch; the maven image is
# ignored because Dependabot changed its JDK suffix (#305).
#
# No labels: generated release notes group by pull request label, this
# repository does not label pull requests, and the release workflow depends on
# that.
# =============================================================================
version: 2

updates:
  # "/" is the repository root, which is where Dependabot looks for
  # .github/workflows - not a directory to point at the workflows themselves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: []
    commit-message:
      # Conventional Commits, so the generated release notes stay readable.
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: []
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      maven:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: []
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      npm:
        patterns:
          - "*"

  # Both Dockerfiles: the backend image at the root, the nginx image in frontend/.
  - package-ecosystem: docker
    directories:
      - /
      - /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: []
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    ignore:
      - dependency-name: nginx
        update-types:
          - version-update:semver-minor
      # The maven tag carries the JDK as a suffix (3-eclipse-temurin-21), and
      # Dependabot swapped that suffix to Temurin 26 in #305 although the
      # allow rule takes minor and patch only. The tag floats and is pulled
      # fresh on every build, so nothing is lost by ignoring it; a JDK change
      # is made by hand with the runtime image and <java.version>.
      - dependency-name: maven
    groups:
      docker:
        patterns:
          - "*"
