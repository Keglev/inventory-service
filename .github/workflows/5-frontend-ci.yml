# =============================================================================
# Smart Supply Pro – Frontend CI
#
# Triggers on push/PR to main when frontend or Nginx config files change.
# Audits the installed dependency tree, then runs ESLint, then Vitest unit tests
# outside Docker to get GitHub annotation support. An advisory of high severity
# or above in a dependency that ships to the browser fails the job; lint errors
# fail it too. Both block the merge through the build-and-test check.
# Builds and pushes a Docker image (Nginx + Vite bundle) tagged by commit SHA.
# On success, triggers: 6-deploy-frontend.yml (Koyeb deployment).
# =============================================================================
name: 5 Frontend CI - Build & Test

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'ops/nginx/**'
      - '.github/workflows/5-frontend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'ops/nginx/**'
      - '.github/workflows/5-frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Only one frontend build at a time — do not cancel in progress to avoid broken image state
concurrency:
  group: frontend-ci
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/ssp-frontend
  # Pinned so local and CI environments stay aligned; update intentionally
  NPM_VERSION: '11.10.1'
  # Backend API base baked into the Vite production bundle
  VITE_API_BASE: https://api.smartsupplypro.de

# Pull requests run tests and upload coverage only. Image build/push is gated to
# push events so an unmerged branch can never overwrite the :latest tag.
jobs:
  # Named build-and-test so this workflow satisfies the required status check
  # for frontend pull requests; see the header of 1-ci-test.yml.
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      # npm version drift causes lockfile metadata churn; pin to keep CI deterministic
      - name: Pin npm version
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          echo "npm: $(npm --version)"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The backend image is scanned by Trivy with a hard fail on fixed
      # CRITICAL and HIGH findings; this is the frontend's equivalent, and it
      # is deliberately scoped the same way, to what actually ships.
      #   PASSES when no dependency reachable from "dependencies" carries an
      #     advisory of high severity or above.
      #   FAILS when one does, at which point the job stops before lint.
      #   DOES NOT CHECK devDependencies. A Vitest or ESLint advisory is real
      #     but it does not reach a browser, and a gate that blocks an
      #     unrelated merge on one gets ignored or removed. The step below
      #     reports the full tree instead.
      - name: Audit dependencies that ship (gate)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # Runs even when the gate above fails, so the failure arrives with the
      # full picture attached rather than an exit code alone.
      - name: Report the full dependency tree
        if: always()
        working-directory: frontend
        run: |
          set -euo pipefail
          {
            echo "## Dependency audit"
            echo ""
            echo '```'
            npm audit 2>&1 || true
            echo '```'
            echo ""
            echo "Development-only findings are reported here and do not fail the job."
          } >> "$GITHUB_STEP_SUMMARY"

      # Lint before the tests: it is the cheapest failure, and at this point
      # frontend/coverage/ does not exist yet, so no generated Istanbul file is
      # linted. Errors fail the job; warnings do not gate yet.
      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      # Tests run outside Docker so failures appear as inline GitHub annotations
      - name: Run unit tests (Vitest)
        working-directory: frontend
        env:
          CI: "true"
        run: npx vitest --reporter=default --reporter=github-actions --run --coverage
      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: frontend/coverage/
          retention-days: 30

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Generate Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=sha
      # Build context is repo root so the Dockerfile can access ops/nginx config
      - name: Build and push image
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=${{ env.VITE_API_BASE }}
            VITE_BUILD_ID=${{ github.sha }}
            VITE_APP_ENVIRONMENT=Production (Koyeb)
            RUN_TESTS=false
            NPM_VERSION=${{ env.NPM_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Job summary
        if: always()
        run: |
          echo "## Frontend CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Coverage artifact:** \`frontend-coverage-html-${{ github.event.pull_request.head.sha || github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "- **Image:** not built on pull requests (tests only)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Image:** \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Next:** \`6-deploy-frontend.yml\` deploys this image to Koyeb" >> $GITHUB_STEP_SUMMARY
          fi