# =============================================================================
# Smart Supply Pro – Frontend CI
#
# Triggers on push/PR to main when frontend or Nginx config files change.
# Audits the installed dependency tree, then runs ESLint, then Vitest unit tests
# outside Docker to get GitHub annotation support. An advisory of high severity
# or above in a dependency that ships to the browser fails the job; lint errors
# fail it too. Both block the merge through the build-and-test check.
# Builds and pushes a Docker image (Nginx + Vite bundle) tagged by commit SHA,
# then scans it with Trivy on the same terms as the backend image. A fixed CVE
# of high severity or above in the image fails the job, which stops the deploy.
# On success, triggers: 6-deploy-frontend.yml (Koyeb deployment).
# =============================================================================
name: 5 Frontend CI - Build & Test

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'ops/nginx/**'
      - '.github/workflows/5-frontend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'ops/nginx/**'
      - '.github/workflows/5-frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Only one frontend build at a time — do not cancel in progress to avoid broken image state
concurrency:
  group: frontend-ci
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/ssp-frontend
  # Pinned so local and CI environments stay aligned; update intentionally
  NPM_VERSION: '11.10.1'
  # Backend API base baked into the Vite production bundle
  VITE_API_BASE: https://api.smartsupplypro.de

# Pull requests run tests and upload coverage only. Image build/push is gated to
# push events so an unmerged branch can never overwrite the :latest tag.
jobs:
  # Named build-and-test so this workflow satisfies the required status check
  # for frontend pull requests; see the header of 1-ci-test.yml.
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      # npm version drift causes lockfile metadata churn; pin to keep CI deterministic
      - name: Pin npm version
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          echo "npm: $(npm --version)"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The backend image is scanned by Trivy with a hard fail on fixed
      # CRITICAL and HIGH findings; this is the frontend's equivalent, and it
      # is deliberately scoped the same way, to what actually ships.
      #   PASSES when no dependency reachable from "dependencies" carries an
      #     advisory of high severity or above.
      #   FAILS when one does, at which point the job stops before lint.
      #   DOES NOT CHECK devDependencies. A Vitest or ESLint advisory is real
      #     but it does not reach a browser, and a gate that blocks an
      #     unrelated merge on one gets ignored or removed. The step below
      #     reports the full tree instead.
      - name: Audit dependencies that ship (gate)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # Runs even when the gate above fails, so the failure arrives with the
      # full picture attached rather than an exit code alone.
      - name: Report the full dependency tree
        if: always()
        working-directory: frontend
        run: |
          set -euo pipefail
          {
            echo "## Dependency audit"
            echo ""
            echo '```'
            npm audit 2>&1 || true
            echo '```'
            echo ""
            echo "Development-only findings are reported here and do not fail the job."
          } >> "$GITHUB_STEP_SUMMARY"

      # Lint before the tests: it is the cheapest failure, and at this point
      # frontend/coverage/ does not exist yet, so no generated Istanbul file is
      # linted. Errors fail the job; warnings do not gate yet.
      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      # Tests run outside Docker so failures appear as inline GitHub annotations
      - name: Run unit tests (Vitest)
        working-directory: frontend
        env:
          CI: "true"
        run: npx vitest --reporter=default --reporter=github-actions --run --coverage
      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: frontend/coverage/
          retention-days: 30

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Generate Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=sha
      # Build context is repo root so the Dockerfile can access ops/nginx config
      - name: Build and push image
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=${{ env.VITE_API_BASE }}
            VITE_BUILD_ID=${{ github.sha }}
            VITE_APP_ENVIRONMENT=Production (Koyeb)
            RUN_TESTS=false
            NPM_VERSION=${{ env.NPM_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The backend image has been scanned since it existed; this image never
      # was. Same action, same version, same terms, so the two images are held
      # to one standard rather than two.
      #   PASSES when the image carries no CVE of high severity or above that
      #     has a published fix.
      #   FAILS the job, which stops 6-deploy-frontend: that workflow runs only
      #     when this one concludes success. The image is on Docker Hub by then
      #     and is deliberately left there, tagged by commit SHA, so the
      #     scan report can be reproduced against the exact artifact.
      #   DOES NOT CHECK findings with no fix available. ignore-unfixed keeps
      #     the gate actionable; an unfixable finding would block every merge
      #     until upstream moved, which is how a gate gets switched off.
      #
      # Pinned by commit SHA for the reason recorded in 2-docker-backend.yml:
      # in March 2026 every version tag of this action was force-pushed to
      # credential-stealing code. The scanner version is set explicitly rather
      # than inherited, because the action's own default trails its releases.
      - name: Scan image for CVEs (Trivy)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          version: v0.74.0
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          # The action caches Trivy's databases by default, under a key it
          # hardcodes as cache-trivy-<date> with a cache-trivy- restore prefix,
          # so the backend scan and this one share one entry and the key is not
          # configurable. On 2026-09-10 this step restored 964 MB, was told by
          # Trivy that the database still needed updating, downloaded the 112 MB
          # database anyway in 3.3 s, and wrote 964 MB back under a new daily
          # key: 25 s spent to avoid 3 s, and a gigabyte a day against a cache
          # budget this repository has already had to defend once (see the note
          # above the JDK step in 1-ci-test.yml).
          #
          # Most of that gigabyte is the Java database, which this scan never
          # opens: the image is Nginx and static assets, and the same run logged
          # "Number of language-specific files num=0". The backend image ships a
          # jar and does need it, so the backend step keeps its cache.
          #
          # One input governs both caches, so this also gives up the 44 MB
          # binary cache; setup-trivy falls back to its install script and a
          # 50 MB release download instead.
          cache: false

      - name: Job summary
        if: always()
        run: |
          echo "## Frontend CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Coverage artifact:** \`frontend-coverage-html-${{ github.event.pull_request.head.sha || github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "- **Image:** not built on pull requests (tests only)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Image:** \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Next:** \`6-deploy-frontend.yml\` deploys this image to Koyeb" >> $GITHUB_STEP_SUMMARY
          fi