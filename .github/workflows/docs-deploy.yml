# =============================================================================
# docs-deploy.yml - publishes the docs site to gh-pages and GitHub Pages
# Usage: runs after docs-build.yml succeeds on main (workflow_run) and
#        consumes its docs-site artifact.
# Produces: the paths that artifact's MANIFEST names, replaced on gh-pages, then
#        a Pages deployment of that branch from this job (Pages source: GitHub
#        Actions; backend ADR-0015), named after the gh-pages commit by
#        .github/scripts/deploy-pages.sh.
#
# Failure mode: a failed push to gh-pages or a failed Pages deployment fails
# the run, and the site keeps the version last published.
# =============================================================================
name: Docs Deploy - GitHub Pages

on:
  workflow_run:
    workflows: ["Docs Build - Site & Link Check"]
    types: [completed]
    # Second guard behind docs-build's own branch filter.
    branches: [ "main" ]

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

# One gh-pages push and one deployment at a time. queue: max keeps every pending run:
# each publishes a different docs-build artifact, so a dropped run would drop that
# share of the site.
concurrency:
  group: ghpages-deploy
  cancel-in-progress: false
  queue: max

jobs:
  deploy-ghpages:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download docs-site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: docs-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Replace exactly the MANIFEST paths and leave the rest of the branch, so up to
      # three runs of one merge publish their parts in any order. Each listed path is
      # removed before the copy, so a page deleted at source disappears.
      - name: Sync docs-site into gh-pages root
        run: |
          set -euo pipefail

          if [ ! -s "docs-site/MANIFEST" ]; then
            echo "::error::docs-site artifact carries no MANIFEST"
            exit 1
          fi

          echo "Publishing $(wc -l < docs-site/MANIFEST) path(s):"
          while IFS= read -r ENTRY; do
            [ -n "$ENTRY" ] || continue
            if [ ! -e "docs-site/$ENTRY" ]; then
              echo "::error::MANIFEST names $ENTRY but the artifact does not contain it"
              exit 1
            fi
            rm -rf "./${ENTRY:?}"
            mkdir -p "$(dirname "./$ENTRY")"
            cp -R "docs-site/$ENTRY" "./$ENTRY"
            echo "  published $ENTRY"
          done < docs-site/MANIFEST

          rm -rf docs-site

      - name: Commit and push to gh-pages
        id: publish
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git status --porcelain | grep .; then
            git add .
            git commit -m "docs: publish from workflow_run ${{ github.event.workflow_run.id }}"
            git push origin gh-pages
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Documentation published"
          elif [ "$RUN_ATTEMPT" -gt 1 ]; then
            # A re-run deploys again, and a deployment is named after a gh-pages
            # commit, so the retry gets a commit of its own.
            git commit --allow-empty -m "docs: redeploy, workflow_run ${{ github.event.workflow_run.id }} attempt $RUN_ATTEMPT"
            git push origin gh-pages
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to publish; empty commit for the redeploy"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to publish"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # DEPLOYS when the branch changed, or on a re-run (a failed deployment retries
      # without a new commit). SKIPS when nothing changed: the live site matches.
      # One artifact name per attempt: artifacts belong to the run, so a re-run
      # would otherwise find the first attempt's artifact beside its own.
      - name: Upload the gh-pages tree as the Pages artifact
        id: pages-artifact
        if: steps.publish.outputs.changed == 'true' || github.run_attempt > 1
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .

      # The workspace is gh-pages, so the script comes from the commit this
      # workflow file was read from (github.sha), into the runner's temp dir.
      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.publish.outputs.changed == 'true' || github.run_attempt > 1
        env:
          ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
          PAGES_SHA: ${{ steps.publish.outputs.sha }}
          SCRIPT_REF: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SCRIPT_REF"
          git show FETCH_HEAD:.github/scripts/deploy-pages.sh > "$RUNNER_TEMP/deploy-pages.sh"
          bash "$RUNNER_TEMP/deploy-pages.sh"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## GitHub Pages Deployment"
            echo "- **Branch:** \`gh-pages\`"
            echo "- **Site:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          } >> "$GITHUB_STEP_SUMMARY"
