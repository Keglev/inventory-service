# =============================================================================
# docs-build.yml - builds the documentation site into the docs-site artifact
# Usage: runs on a push to main that touches docs/ or the docs pipeline, and
#        after Backend CI or Frontend CI succeeds on main (workflow_run);
#        docs-deploy.yml follows.
#        Consumes jacoco-html-{SHA} (backend-ci.yml) and
#        frontend-coverage-html-{SHA} (frontend-ci.yml) when the trigger has one.
# Produces: the docs-site artifact (the built subtrees and their MANIFEST),
#        consumed by docs-deploy.yml.
#
# Failure mode: a page that fails to render, a page whose Mermaid loading
# disagrees with its diagrams, or a broken internal link fails the run before
# the docs-site artifact is uploaded; docs-deploy.yml then never starts and
# the published site stays as it was.
# =============================================================================
name: Docs Build - Site & Link Check

on:
  workflow_run:
    workflows:
      - "Backend CI - Build & Test"
      - "Frontend CI - Build & Test"
    types: [completed]
    # Only CI runs on main feed the public docs site; PR runs must never publish.
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - '.github/scripts/docs/**'
      - '.github/actions/docs-toolchain/**'
      - '.github/workflows/docs-build.yml'
      - 'lychee.toml'

# Read only: this workflow builds and uploads an artifact and pushes nothing;
# docs-deploy.yml is the one that writes to gh-pages.
permissions:
  contents: read
  actions: read

# Runs queue: one merge can start up to three runs (push, after each CI), each with
# its own artifact, and the publisher replaces only a run's MANIFEST paths, so order
# is safe. queue: max keeps every pending run; without it GitHub keeps one.
concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build-docs:
    # Only a push to this repository's main: the branches filter matches a NAME,
    # and a fork's pull request can call its branch "main" and pass its own CI;
    # the event and the head repository cannot be set from a fork.
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || github.event_name == 'push'
    # The image, not ubuntu-latest: pandoc comes from the Ubuntu archive, and 24.04
    # has exactly 3.1.3+ds-2; on the next LTS that version is gone, so moving the
    # OS is a scheduled change.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # The commit upstream CI ran on, or HEAD for a direct push. Depth 2: no history
      # is read, but the gate below diffs the merge against its parent.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # Which of the five subtrees this merge can have changed: the commit against its
      # first parent (exact for squash merges). The script's header states the three
      # outcomes; DOCS_TRIGGER tells it which of a merge's runs this is.
      - name: Decide which parts of the site to rebuild
        id: gate
        env:
          DOCS_TRIGGER: >-
            ${{ github.event_name == 'push' && 'push'
              || github.event.workflow_run.name == 'Backend CI - Build & Test' && 'backend'
              || github.event.workflow_run.name == 'Frontend CI - Build & Test' && 'frontend'
              || 'unknown' }}
        run: bash .github/scripts/docs/decide-rebuild-scope.sh

      # JaCoCo is only available when triggered after backend CI — absent on docs-only pushes
      - name: Download JaCoCo artifact
        if: >
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'Backend CI - Build & Test'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jacoco-html-${{ github.event.workflow_run.head_sha }}
          path: target/site/jacoco
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Frontend coverage is only available when triggered after frontend CI
      - name: Download frontend coverage artifact
        if: >
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'Frontend CI - Build & Test'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage-html-${{ github.event.workflow_run.head_sha }}
          path: target/frontend/coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Node, and the pinned Redocly CLI and Pandoc when this run renders their pages;
      # the npm pin and cache only when TypeDoc needs npm ci. The pins and their
      # reasons live in the action, shared with docs-pr-check.yml.
      - name: Docs toolchain
        uses: ./.github/actions/docs-toolchain
        with:
          redoc: ${{ steps.gate.outputs.redoc }}
          pandoc: ${{ steps.gate.outputs.pandoc }}
          frontend-install: ${{ steps.gate.outputs.typedoc }}

      # Frontend dependencies for TypeDoc. A failed install fails the run rather than
      # rendering a site from whatever happens to be there.
      - name: Install frontend dependencies
        if: steps.gate.outputs.typedoc == 'true'
        run: |
          set -euo pipefail
          cd frontend
          npm ci

      # Blocking: the baseline has zero warnings, so one means something changed, and
      # TypeDoc exits 0 when it only warns, hence --treatWarningsAsErrors (exit 3 on a
      # single warning).
      - name: Generate TypeDoc markdown
        if: steps.gate.outputs.typedoc == 'true'
        run: |
          set -euo pipefail
          cd frontend
          npx typedoc --options typedoc.json --treatWarningsAsErrors

      # The generators the gate selected. build-docs.sh treats an unset variable as
      # "build it", so docs-pr-check.yml, which sets none of these, keeps building
      # the whole site.
      - name: Build docs site
        env:
          DOCS_BUILD_REDOC: ${{ steps.gate.outputs.redoc }}
          DOCS_BUILD_TYPEDOC: ${{ steps.gate.outputs.typedoc }}
          DOCS_BUILD_ARCH_BACKEND: ${{ steps.gate.outputs.arch_backend }}
          DOCS_BUILD_ARCH_FRONTEND: ${{ steps.gate.outputs.arch_frontend }}
          DOCS_BUILD_DECISIONS: ${{ steps.gate.outputs.decisions }}
        run: |
          bash .github/scripts/docs/build-docs.sh .

      # A page loads Mermaid exactly when it draws a diagram. Reads what this run
      # built: a carried-forward subtree was checked by the run that built it.
      #   PASSES when every page agrees. FAILS on a disagreeing page or on no page.
      - name: Check which pages load Mermaid
        run: bash .github/scripts/docs/check-mermaid-pages.sh target/docs

      # The published site, one commit deep, for the assembly to lay this build over.
      # Only a missing branch is tolerated (before the first publish there is no
      # gh-pages, and the assembly uses this build alone).
      - name: Fetch the published site
        run: |
          set -euo pipefail
          if git fetch --depth=1 origin gh-pages; then
            mkdir -p target/gh-pages
            git archive FETCH_HEAD | tar -x -C target/gh-pages
            echo "Published site: $(find target/gh-pages -type f | wc -l) files"
          else
            echo "::warning::No gh-pages branch found — assembling from this build alone"
          fi

      # This build laid over the published site, one subtree at a time: a subtree the
      # gate did not rebuild is carried forward instead of vanishing.
      - name: Assemble the site to publish
        run: |
          bash .github/scripts/docs/assemble-site.sh . target/gh-pages

      # Same checker, version and config as docs-pr-check.yml, so the publishing build
      # agrees with the PR gate on a broken link; it reads the assembled tree, the
      # site about to be published.
      - name: Stage the site for link checking
        run: |
          mkdir -p target/link-check
          cp -r target/publish target/link-check/inventory-service
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --config lychee.toml
            --root-dir "${{ github.workspace }}/target/link-check"
            "target/link-check/inventory-service/**/*.html"

      # The built tree plus its MANIFEST, not the assembled site: a run publishes what
      # it produced, and shipping the assembly would overwrite subtrees it never built.
      - name: Upload docs-site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: target/docs
