# =============================================================================
# Smart Supply Pro - Release
#
# Turns a pushed tag into a GitHub release. The tag is the decision; this
# workflow only records it. Nothing here builds, tests or deploys: by the time a
# tag exists, main has already been built, tested and released to both hosts.
#
# The version check is the point of the job. Both tiers declare a version that
# ships to users - the backend at /actuator/info, the frontend in its bundle -
# and a tag that disagrees with either of them would publish a release naming a
# version nothing actually reports. The job fails before creating anything.
#
# Notes are generated by GitHub from the merged pull requests since the previous
# tag. There is no category configuration: GitHub groups generated notes by pull
# request label, this repository does not label pull requests, and a config
# without labels would produce empty sections. The titles are Conventional
# Commits and read as a changelog on their own.
# =============================================================================
name: 8 Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v7

      - name: Check the tag against both declared versions
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # Anchored on the artifactId so the parent's <version> cannot match.
          POM="$(grep -A1 '<artifactId>inventory-service</artifactId>' pom.xml \
            | grep '<version>' \
            | sed -E 's|.*<version>(.*)</version>.*|\1|')"
          PKG="$(jq -r .version frontend/package.json)"

          echo "tag=$TAG  version=$VERSION  pom=$POM  package.json=$PKG"

          FAILED=0
          if [ "$POM" != "$VERSION" ]; then
            echo "::error::pom.xml declares $POM but the tag says $VERSION"
            FAILED=1
          fi
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::frontend/package.json declares $PKG but the tag says $VERSION"
            FAILED=1
          fi
          [ "$FAILED" -eq 0 ] || exit 1

          echo "PASS [release] both tiers declare $VERSION"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      - name: Job summary
        if: always()
        run: |
          echo "## Release ${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- **Notes:** generated from merged pull requests since the previous tag" >> $GITHUB_STEP_SUMMARY
