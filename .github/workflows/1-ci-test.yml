# =============================================================================
# Smart Supply Pro – Backend Build & Test
#
# Compiles, tests, and generates JaCoCo coverage for the backend service.
# On success, triggers: 2-docker-backend.yml (image build and scan).
#
# This is the repository's merge gate. Its job is named build-and-test, the
# status check branch protection requires on main. Three workflows declare a job
# by that name: this one, 5-frontend-ci.yml and docs-pr-check.yml. The invariant
# is coverage, not exclusivity. Every path reaches at least one of them, so no
# pull request is left without the required check. A pull request confined to one
# family is reported by exactly one workflow; one that spans families is reported
# by each workflow whose paths it touches, and the check passes only when all of
# them pass. A path may be ignored below ONLY if another workflow gives that pull
# request a build-and-test check; a path ignored everywhere leaves its pull
# requests permanently blocked. README.md and LICENSE deliberately stay here:
# they are outside docs/ and the docs build never reads them. docs-pr-check.yml
# triggers on itself, and its own file is ignored below, so a pull request
# editing the docs gate is reported by that workflow alone.
# =============================================================================
name: 1 Backend CI - Build & Test

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'frontend/**'
      - 'ops/nginx/**'
      - '.github/workflows/5-frontend-ci.yml'
      - 'docs/**'
      - '.github/scripts/docs/**'
      - '.github/workflows/docs-pipeline.yml'
      - 'lychee.toml'
      - '.github/workflows/docs-pr-check.yml'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'frontend/**'
      - 'ops/nginx/**'
      - '.github/workflows/5-frontend-ci.yml'
      - 'docs/**'
      - '.github/scripts/docs/**'
      - '.github/workflows/docs-pipeline.yml'
      - 'lychee.toml'
      - '.github/workflows/docs-pr-check.yml'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Supports both monorepo (inventory-service/pom.xml) and flat (pom.xml) layouts
      - name: Resolve backend directory
        run: |
          set -euo pipefail
          if [ -f "inventory-service/pom.xml" ]; then
            echo "BACKEND_DIR=inventory-service" >> "$GITHUB_ENV"
          elif [ -f "pom.xml" ]; then
            echo "BACKEND_DIR=." >> "$GITHUB_ENV"
          else
            echo "::error::pom.xml not found at repo root or inventory-service/"
            exit 1
          fi

      # setup-java's own maven cache is the only one. A second actions/cache step
      # on ~/.m2 used to sit below this, described as a fallback for when this
      # cache missed. It could not act as one: both keys hashed pom.xml, so they
      # missed together, and every run restored the same directory twice and
      # saved it twice. It was also half of the repository's Maven cache
      # footprint, competing with the image scanner's database for the 10 GB
      # Actions cache budget.
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: |
          set -euo pipefail
          cd "$BACKEND_DIR"
          mvn clean verify -Dspring.profiles.active=test -Dtestcontainers.enabled=false
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID }}
          SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET }}

      # Non-blocking — useful for tracking Spring version drift between dependency updates.
      # Not -q: dependency:list writes at INFO, which -q suppresses, so the grep
      # matched nothing and this step printed nothing from the day it was added.
      - name: Show Spring and Security versions
        run: |
          cd "$BACKEND_DIR"
          mvn -ntp dependency:list -DincludeGroupIds=org.springframework,org.springframework.security | \
            grep -E 'spring-core|spring-security-core' || true

      - name: Upload JaCoCo coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.BACKEND_DIR }}/target/site/jacoco/
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          echo "## Backend Build & Test" >> $GITHUB_STEP_SUMMARY
          echo "- **Coverage artifact:** \`jacoco-html-${{ github.event.pull_request.head.sha || github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Next:** \`2-docker-backend.yml\` builds and scans the Docker image" >> $GITHUB_STEP_SUMMARY