# =============================================================================
# backend-docker.yml - builds, scans and publishes the backend image
# Usage: runs after Backend CI succeeds on a push to main (workflow_run), or by
#        hand (workflow_dispatch builds the dispatched ref's HEAD). No push
#        trigger on purpose: start.sh, the Dockerfile and this file fall through
#        to backend-ci.yml, and a direct trigger would build in parallel with the
#        tests it must wait for.
# Produces: the image ghcr.io/keglev/inventory-service/backend under :latest and
#        the full commit hash, its SBOM artifact, and the artifact built-commit
#        (the commit and the gate verdict) that backend-deploy.yml releases.
# Failure mode: a failed build, a HIGH or CRITICAL CVE with a fix, or three
#        failed pushes fail the job; nothing is published under either tag and
#        backend-deploy.yml, which chains on this run's success, does not run.
# =============================================================================
name: Backend Docker - Build & Scan

on:
  workflow_run:
    workflows: ["Backend CI - Build & Test"]
    types: [completed]
    branches: [ "main" ]
  # A manual run builds the dispatched ref's HEAD (IMAGE_TAG_SHA falls back to
  # github.sha).
  workflow_dispatch:

# Each run gates one main commit, so a dropped run would leave its change unbuilt:
# runs wait in order. queue: max holds up to 100 pending runs; without it GitHub
# keeps one and cancels the rest.
concurrency:
  group: backend-docker-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  docker-build-and-scan:
    # Only a push to this repository's main: the branches filter matches a NAME,
    # and a fork's pull request can call its branch "main" and pass its own CI;
    # the event and the head repository cannot be set from a fork.
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_REPO: ghcr.io/keglev/inventory-service/backend
      IMAGE_TAG_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      # Image gate: the commit against its first parent. Only src/main/ of src/
      # reaches the jar (it is packaged with tests skipped).
      #   BUILDS when a path in the list changed, or on a manual run.
      #   SKIPS otherwise: green, no image, and backend-deploy releases nothing.
      #   DOES NOT CHECK whether the change alters the jar: a comment in src/main
      #     rebuilds and restarts the backend.
      - name: Checkout for change detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Decide whether the image must be rebuilt
        id: gate
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only HEAD^ HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/main/|pom\.xml|Dockerfile|scripts/|docker/docker-compose\.prod\.yml|\.github/workflows/(backend-docker|backend-deploy)\.yml)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No image-relevant change; skipping build and release." >> "$GITHUB_STEP_SUMMARY"
          fi

      # backend-deploy must release the commit built here, and a workflow_run run's
      # head_sha is main's HEAD at creation, a later merge when merges outpace CI.
      # The gate verdict travels with it, so the release decision is made once.
      - name: Record the commit and the verdict for backend-deploy
        run: |
          echo "${IMAGE_TAG_SHA}" > built-commit.txt
          echo "${{ steps.gate.outputs.build }}" > build.txt
      - name: Hand them to backend-deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-commit
          path: |
            built-commit.txt
            build.txt
          retention-days: 1

      - name: Checkout code
        if: steps.gate.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.IMAGE_TAG_SHA }}

      # GITHUB_TOKEN with packages: write is enough for the repository's own GHCR
      # namespace; no registry secret exists for this step.
      - name: Login to GHCR
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          docker build --no-cache \
            --build-arg BUILD_COMMIT="${IMAGE_TAG_SHA}" \
            -t "$IMAGE_REPO:latest" \
            -t "$IMAGE_REPO:${IMAGE_TAG_SHA}" \
            .

      # SBOM and CVE gate, one Trivy analysis (the action's banner says why the
      # SBOM comes first). It runs before the push, so a rejected image never
      # reaches GHCR, and a failure stops backend-deploy.yml.
      #   PASSES when the SBOM holds the Java libraries inside app.jar and the
      #     image carries no HIGH or CRITICAL CVE with a published fix.
      #   FAILS the job before the push below, so nothing reaches GHCR.
      #   DOES NOT CHECK findings with no fix available (ignore-unfixed).
      - name: SBOM and CVE gate (Trivy)
        if: steps.gate.outputs.build == 'true'
        uses: ./.github/actions/image-sbom-scan
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG_SHA }}
          name: backend
          sha: ${{ env.IMAGE_TAG_SHA }}
          required-purl: 'pkg:maven/'
          upload: 'true'

      # The only publishing step, last on purpose: both tags move once the scan passed,
      # so a tag here names an image that cleared it. GHCR can answer "unknown blob"
      # after all layers uploaded; a push is idempotent, so three tries, 15 s then 30 s apart.
      - name: Push Docker images
        if: steps.gate.outputs.build == 'true'
        run: |
          set -eu
          push() {
            for attempt in 1 2 3; do
              if docker push "$1"; then
                return 0
              fi
              echo "::warning::docker push $1 failed (attempt $attempt of 3)"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 15))
              fi
            done
            return 1
          }
          push "$IMAGE_REPO:latest"
          push "$IMAGE_REPO:${IMAGE_TAG_SHA}"

      - name: Job summary
        if: always() && steps.gate.outputs.build == 'true'
        run: |
          {
            echo "## Backend Docker Build & Scan"
            echo "- **Image:** \`$IMAGE_REPO:${IMAGE_TAG_SHA}\`"
            echo "- **SBOM:** artifact \`sbom-backend-${IMAGE_TAG_SHA}\` (60 days)"
            echo "- **Next:** \`backend-deploy.yml\` releases this image to the Hetzner host"
          } >> "$GITHUB_STEP_SUMMARY"
