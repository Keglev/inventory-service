# =============================================================================
# Smart Supply Pro – Backend Docker Build & Security Scan
#
# Triggered after backend-ci.yml succeeds on main. Builds the production image,
# scans it for CVEs, and pushes it to GHCR under the repository's own package.
# On success, triggers: backend-deploy.yml (release to the Hetzner host).
#
# No push trigger on purpose: start.sh, the Dockerfile and this file all fall
# through to backend-ci.yml, so the workflow_run chain covers them. A direct
# push trigger would build and deploy in parallel with the tests it is
# supposed to wait for.
# =============================================================================
name: Backend Docker - Build & Scan

on:
  workflow_run:
    workflows: ["Backend CI - Build & Test"]
    types: [completed]
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Commit SHA to build (defaults to HEAD)'
        required: false
        default: ''

# Every run here belongs to one main commit (a workflow_run event carries main as
# its ref), and the gate below looks at that commit alone. A cancelled or dropped
# run would leave its commit's change unbuilt, so runs wait in order instead
# (CI-1). queue: max holds up to 100 pending runs; without it GitHub keeps one.
concurrency:
  group: backend-docker-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  docker-build-and-scan:
    # Only a push to this repository's main may start this job. The branches
    # filter above matches the triggering run's branch NAME, and a fork's pull
    # request can name its branch "main" and make its own CI pass; the event and
    # the head repository cannot be set from a fork.
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_REPO: ghcr.io/keglev/inventory-service/backend
      IMAGE_TAG_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      # A catch-all merge (README, LICENSE, workflow tweaks) still runs backend
      # CI, but rebuilding and restarting a healthy backend for it serves
      # nothing. Compare the released commit against its first parent and stop
      # here when no path the image depends on has changed. backend-deploy
      # chains on this workflow's success, so skipping the build skips the
      # release too; a skipped run is reported as success with no image.
      # Only src/main/ reaches the jar: it is packaged with tests skipped, and
      # nothing else under src/ is part of the build. A test-only merge would
      # otherwise rebuild and restart the backend with an identical jar.
      - name: Checkout for change detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Decide whether the image must be rebuilt
        id: gate
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only HEAD^ HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/main/|pom\.xml|Dockerfile|scripts/|docker/docker-compose\.prod\.yml|\.github/workflows/(backend-docker|backend-deploy)\.yml)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No image-relevant change; skipping build and release." >> "$GITHUB_STEP_SUMMARY"
          fi

      # backend-deploy must release the commit this run builds. It cannot read it
      # from this run: a workflow_run run's head_sha is main's HEAD when the run was
      # created, a later merge whenever merges outpace CI (CI-2: deploy #88 asked
      # GHCR for 8b7794a while this workflow had built 858e0c6). The gate's verdict
      # travels with it, so the release decision is made once, here (W2): two
      # files, one day.
      - name: Record the commit and the verdict for backend-deploy
        run: |
          echo "${IMAGE_TAG_SHA}" > built-commit.txt
          echo "${{ steps.gate.outputs.build }}" > build.txt
      - name: Hand them to backend-deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-commit
          path: |
            built-commit.txt
            build.txt
          retention-days: 1

      - name: Checkout code
        if: steps.gate.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.IMAGE_TAG_SHA }}

      # GITHUB_TOKEN with packages: write is enough for the repository's own GHCR
      # namespace; no registry secret exists for this step.
      - name: Login to GHCR
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          docker build --no-cache \
            --build-arg BUILD_COMMIT="${IMAGE_TAG_SHA}" \
            -t "$IMAGE_REPO:latest" \
            -t "$IMAGE_REPO:${IMAGE_TAG_SHA}" \
            .

      # Verify the production image contains only runtime artifacts — no test sources or docs
      - name: Inspect image contents
        if: steps.gate.outputs.build == 'true'
        run: |
          docker run --rm "$IMAGE_REPO:${IMAGE_TAG_SHA}" sh -c '
            echo "=== Runtime artifacts ==="
            ls -lh /app/app.jar /app/start.sh
            echo "=== Confirming no test or docs directories ==="
            ls /app/src/test 2>&1 || echo "OK: no test directory"
            ls /app/docs    2>&1 || echo "OK: no docs directory"
          '

      # The image's SBOM and CVE gate, one Trivy analysis (the action's banner
      # records why the SBOM comes first). Blocks backend-deploy.yml, which
      # chains on this workflow's success, and does so before the image is
      # published: until 2026-09-15 the push ran before the scan, so a rejected
      # image was already on GHCR under both tags when the gate fired.
      #   PASSES when the SBOM holds the Java libraries inside app.jar and the
      #     image carries no HIGH or CRITICAL CVE with a published fix.
      #   FAILS the job before the push below, so nothing reaches GHCR.
      #   DOES NOT CHECK findings with no fix available (ignore-unfixed).
      - name: SBOM and CVE gate (Trivy)
        if: steps.gate.outputs.build == 'true'
        uses: ./.github/actions/image-sbom-scan
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG_SHA }}
          name: backend
          sha: ${{ env.IMAGE_TAG_SHA }}
          required-purl: 'pkg:maven/'
          upload: 'true'

      # The only step here that publishes anything, and deliberately the last
      # one that could. Both tags move together once the scan above has passed,
      # so a tag in this package names an image that cleared the gate rather
      # than one that was merely built. The scan reads the local daemon, where
      # the build step left the image; until this step runs there is nothing
      # under that tag on GHCR for it to have read instead.
      #
      # GHCR sometimes rejects a push after every layer has uploaded ("unknown
      # blob" while the manifest is written); on 2026-09-28 a rerun of the same
      # commit went through. Each push gets up to three attempts, 15 s and
      # then 30 s apart. A push of the same tag and content is idempotent, so a
      # retry cannot publish anything the first attempt would not have.
      - name: Push Docker images
        if: steps.gate.outputs.build == 'true'
        run: |
          set -eu
          push() {
            for attempt in 1 2 3; do
              if docker push "$1"; then
                return 0
              fi
              echo "::warning::docker push $1 failed (attempt $attempt of 3)"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 15))
              fi
            done
            return 1
          }
          push "$IMAGE_REPO:latest"
          push "$IMAGE_REPO:${IMAGE_TAG_SHA}"

      - name: Job summary
        if: always() && steps.gate.outputs.build == 'true'
        run: |
          {
            echo "## Backend Docker Build & Scan"
            echo "- **Image:** \`$IMAGE_REPO:${IMAGE_TAG_SHA}\`"
            echo "- **SBOM:** artifact \`sbom-backend-${IMAGE_TAG_SHA}\` (60 days)"
            echo "- **Next:** \`backend-deploy.yml\` releases this image to the Hetzner host"
          } >> "$GITHUB_STEP_SUMMARY"
