# =============================================================================
# Smart Supply Pro - Deploy Docs to GitHub Pages
#
# Triggered after docs-pipeline.yml succeeds.
# Consumes: docs-site artifact (built by docs-pipeline.yml).
# Publishes static documentation to the gh-pages branch.
# =============================================================================
name: 3 Deploy Docs to GitHub Pages

on:
  workflow_run:
    workflows: ["Docs Pipeline - OpenAPI & Architecture"]
    types: [completed]
    # Second guard behind docs-pipeline's own branch filter.
    branches: [ "main" ]

permissions:
  contents: write
  actions: read

# Prevent concurrent gh-pages pushes — parallel runs cause branch merge conflicts
concurrency:
  group: ghpages-deploy
  cancel-in-progress: false

jobs:
  deploy-ghpages:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download docs-site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: docs-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Replace exactly the paths the run produced, named in MANIFEST, and leave the
      # rest of the branch untouched. The branch is no longer wiped and rewritten:
      # a merge touching docs, backend and frontend produces up to three pipeline
      # runs carrying three different artifacts, and each must be able to publish
      # its own part without reverting the others, in whatever order they land.
      #
      # Each listed directory is removed before it is copied, so a page deleted at
      # source disappears rather than lingering. The previous backup-and-restore of
      # the coverage reports is gone with the wipe that made it necessary.
      - name: Sync docs-site into gh-pages root
        run: |
          set -euo pipefail

          if [ ! -s "docs-site/MANIFEST" ]; then
            echo "::error::docs-site artifact carries no MANIFEST"
            exit 1
          fi

          echo "Publishing $(wc -l < docs-site/MANIFEST) path(s):"
          while IFS= read -r ENTRY; do
            [ -n "$ENTRY" ] || continue
            if [ ! -e "docs-site/$ENTRY" ]; then
              echo "::error::MANIFEST names $ENTRY but the artifact does not contain it"
              exit 1
            fi
            rm -rf "./${ENTRY:?}"
            mkdir -p "$(dirname "./$ENTRY")"
            cp -R "docs-site/$ENTRY" "./$ENTRY"
            echo "  published $ENTRY"
          done < docs-site/MANIFEST

          rm -rf docs-site

      - name: Inject back-to-docs link into coverage report
        run: |
          set -euo pipefail
          for COV in backend/coverage/index.html frontend/coverage/index.html; do
            if [ -f "$COV" ]; then
              if grep -q 'id="back-to-docs"' "$COV"; then
                echo "$COV: back-to-docs link already present — skipping"
              else
                sed -i 's|<body[^>]*>|&<a id="back-to-docs" href="/inventory-service/" style="position:fixed;top:8px;right:12px;z-index:9999;font:14px sans-serif;padding:6px 12px;background:#2563eb;color:#fff;text-decoration:none;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,0.2);">\&larr; Back to docs</a>|' "$COV"
                echo "$COV: back-to-docs link injected"
              fi
            fi
          done
          
      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git status --porcelain | grep .; then
            git add .
            git commit -m "docs: publish from workflow_run ${{ github.event.workflow_run.id }}"
            git push origin gh-pages
            echo "Documentation published"
          else
            echo "No changes to publish"
          fi

      - name: Job summary
        if: always()
        run: |
          echo "## GitHub Pages Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`gh-pages\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Site:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY