# =============================================================================
# yaml-lint.yml - Smart Supply Pro YAML Lint
#
# YAML hygiene for pull requests. Every tracked .yml and .yaml file must parse,
# end with a newline, and carry no trailing whitespace; the rules and the scope
# both live in .github/scripts/check-yaml.sh, so there is one place to change
# either. The workflows are also linted by actionlint, which runs shellcheck on
# every run: block.
#
# No chain prefix on purpose: a lint belongs to none of the backend, frontend or
# docs chains (ADR-0017).
#
# Reusable, like e2e-playwright.yml: backend-ci.yml, frontend-ci.yml and
# docs-pr-check.yml each call it as a job behind their build-and-test
# aggregator, so a finding blocks the merge (F5, 2026-10-20). The checked files
# belong to all three families (workflows, the composite action, Spring
# profiles, Compose), and a pull request confined to one family is reported by
# that family's claimant alone, so all three call it. It was advisory, under its
# own job name, from 2026-10-09 until then.
#
# No concurrency block: the three callers of one pull request share a ref, so a
# group with cancel-in-progress would let them cancel each other's lint.
#
# Three outcomes, decided by the gate job. A pull request whose diff touches a
# checked YAML file, check-yaml.sh or this workflow runs the lint over the whole
# tree, and a finding fails the caller's build-and-test. A manual run always
# lints. Anything else skips the lint and the caller passes it as skipped: a
# pull request without such a change, one confined to docs/backend/api (OpenAPI,
# gated by Redocly in docs-build.yml), and every push to main, whose files the
# pull request already linted.
#
# Failure mode: a parse error (a duplicate key included), trailing
# whitespace, a missing final newline or an actionlint finding fails the lint
# job, and the calling workflow's build-and-test fails with it.
# =============================================================================
name: YAML Lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # HEAD^..HEAD is the pull request's own diff: the checked-out commit is
      # the merge commit. Outcomes as in the header: run=true for a manual run
      # or a relevant pull request diff, run=false otherwise.
      - name: Decide whether the lint is relevant
        id: decide
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            pull_request) ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          changed=$(git diff --name-only HEAD^ HEAD)
          relevant=$(grep -E '\.ya?ml$|^\.github/scripts/check-yaml\.sh$' <<< "$changed" | grep -vE '^docs/backend/api/' || true)
          echo "${relevant:-no checked YAML in this diff}"
          if [ -n "$relevant" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No checked YAML file changed; the YAML lint is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  yaml-lint:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Pinned for the same reason the ReDoc and Pandoc versions are pinned: a
      # parser that changes version changes what the gate means. The npm client
      # is deliberately NOT pinned here, unlike the four jobs that install the
      # frontend tree: one global package has no peer graph to resolve, so the
      # client version cannot change the outcome, and a sixth pin site would
      # make the existing five harder to move.
      - name: Install the YAML parser
        run: |
          set -euo pipefail
          npm install -g js-yaml@5.4.3
          js-yaml --help | head -n 1

      - name: Check YAML
        run: bash .github/scripts/check-yaml.sh

      # Expression syntax, action inputs, workflow_run names and, through the
      # shellcheck bundled in the image, the shell inside every run: block. A
      # pinned image like hadolint, so no new dependency enters the repository.
      # The 37 findings it reported on 2026-10-09 are fixed; from here on a
      # finding fails this job. actionlint 1.7.12 does not yet know
      # concurrency.queue (GitHub changelog 2026-05-07), so that one message
      # is ignored until a release does; drop the -ignore then.
      - name: Lint workflows (actionlint)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
          -color -ignore 'unexpected key "queue" for "concurrency" section'

      - name: Job summary
        if: always()
        run: |
          {
            echo "## YAML Lint"
            echo "- Checks: parse (including duplicate keys), trailing whitespace, final newline."
            echo "- Workflows: actionlint 1.7.12 with shellcheck."
            echo "- Gate: a finding fails the caller's build-and-test check."
          } >> "$GITHUB_STEP_SUMMARY"
