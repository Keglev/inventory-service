# =============================================================================
# frontend-deploy.yml - deploys the frontend image to Koyeb
#
# Usage: runs after frontend-ci.yml succeeds on a push to main (workflow_run),
# or by hand for a rollback or an emergency deploy.
# A merge that changed only test, lint or CI files is not deployed
# (frontend-deploy-gate.sh); the live site then keeps the previous build.
# Deploys by image digest (not tag) for deterministic, rollback-safe releases.
# After the health gate, asserts the serve-time API-base rewrite ran (backend
# ADR-0008; frontend risk FR-01): the check reads the bytes the browser
# receives, the only place that transform is visible.
# Those checks only mean something once the new image is the one answering, so
# the deploy first waits for the commit's build id to appear in the served
# bundle rather than trusting the platform's HEALTHY status.
#
# Failure mode: an image digest that cannot be resolved stops the run before
# Koyeb is touched. A build id that never reaches the edge, a failed health
# check or a rewrite that did not run fail it after the deploy, and the
# diagnostics step prints the service state. Check the live bundle before
# deploying again: a red run is not always a failed deploy.
# =============================================================================
name: Frontend Deploy - Koyeb

on:
  workflow_run:
    workflows: ["Frontend CI - Build & Test"]
    types: [completed]
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

# One rollout at a time, in merge order: two `koyeb service update` runs could
# overlap and the older finish last. Each run deploys the commit its push run built,
# so queue: max keeps every pending run (one slot would skip a commit's deploy).
concurrency:
  group: frontend-deploy
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    # Only a push to this repository's main: the branches filter matches a NAME,
    # and a fork's pull request can call its branch "main" and pass its own CI;
    # the event and the head repository cannot be set from a fork.
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      # Names, not credentials (as secrets they would be masked everywhere in a run);
      # KOYEB_TOKEN and DOCKER_PASSWORD stay secrets. The service's short ID, which the
      # CLI accepts; after a recreate, "koyeb service list" prints the new one.
      KOYEB_SERVICE_ID: 8d13ab85
      FRONTEND_URL: https://www.smartsupplypro.de
      # Origin baked into the bundle by frontend-ci.yml; the rewrite check
      # asserts it is absent from the bytes the browser receives.
      API_ORIGIN: https://api.smartsupplypro.de

    steps:
      # The merge being deployed, with its parent, so the gate can diff them.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # A merge that changed only tests, lint or CI files ships nothing new to
      # the browser; every step below is skipped and the live site keeps the
      # previous build. A manual run always deploys.
      - name: Decide whether this merge needs a deploy
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only HEAD^ HEAD | bash .github/scripts/frontend-deploy-gate.sh

      # The commit's tag resolved to a digest, so the rollout is the scanned image and a
      # rollback has a fixed target; retries cover Docker Hub's lag right after a push.
      - name: Resolve image digest
        if: steps.gate.outputs.deploy == 'true'
        id: img
        run: bash .github/scripts/resolve-image-digest.sh "ckbuzin" "ssp-frontend" "${{ github.event.workflow_run.head_sha || github.sha }}"

      # This job writes the deploy token, so the CLI is one pinned version, checked against
      # the linux_amd64 line of the release's checksums.txt before extraction. To upgrade,
      # raise both values in one commit (github.com/koyeb/koyeb-cli/releases).
      - name: Install Koyeb CLI
        if: steps.gate.outputs.deploy == 'true'
        env:
          KOYEB_CLI_VERSION: '5.12.0'
          KOYEB_CLI_SHA256: 'c39ce972e48c641368d4c09e98fbe6f3b7ae210687db2ed1de706299b7a8534a'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.koyeb/bin"
          archive="$RUNNER_TEMP/koyeb-cli.tar.gz"
          curl -fsSL --max-time 120 --retry 5 --retry-delay 2 \
            "https://github.com/koyeb/koyeb-cli/releases/download/v${KOYEB_CLI_VERSION}/koyeb-cli_${KOYEB_CLI_VERSION}_linux_amd64.tar.gz" \
            -o "$archive"
          echo "${KOYEB_CLI_SHA256}  ${archive}" | sha256sum -c -
          tar -xzC "$HOME/.koyeb/bin" -f "$archive"
          rm -f "$archive"
          test -x "$HOME/.koyeb/bin/koyeb"
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"
          echo "Koyeb CLI pinned: v${KOYEB_CLI_VERSION}"
      # Write token to a restricted file — avoids exposing it via environment variables
      - name: Authenticate Koyeb
        if: steps.gate.outputs.deploy == 'true'
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          umask 077
          printf "token: %s\n" "$KOYEB_TOKEN" > "$HOME/.koyeb.yaml"

      # Retries cover flaky Koyeb-registry connectivity. No registry credential: the
      # image is public and the field optional, and passing one re-attaches it to the
      # service on every deploy, reverting changes made in the console.
      - name: Deploy to Koyeb
        if: steps.gate.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          SVC="${{ env.KOYEB_SERVICE_ID }}"
          REF="${{ steps.img.outputs.image_ref }}"
          echo "Updating $SVC to $REF"

          for attempt in 1 2 3 4 5; do
            if koyeb service update "$SVC" \
              --docker "$REF" \
              --ports 8080:http; then
              echo "Deploy accepted"
              exit 0
            fi
            echo "Attempt $attempt failed — retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

          echo "::error::All deploy attempts failed"
          exit 1
      # Blocks until the commit's build id answers (frontend ADR-0010): the service
      # stays HEALTHY through a rolling update, so the checks below could pass against
      # the outgoing image. 45 attempts, 10 s apart; a successful deploy needs a few.
      - name: Wait for the new build to reach the edge
        if: steps.gate.outputs.deploy == 'true'
        run: bash .github/scripts/wait-for-build.sh "${{ env.FRONTEND_URL }}" "${{ github.event.workflow_run.head_sha || github.sha }}" 45

      # On any failure after the update, Koyeb's own view, to tell a slow rollout from
      # a failed one. Each command ends in `|| true`, so a wrong form fails silently:
      # try a new one with a bogus token first; a valid form then fails on auth.
      - name: Koyeb diagnostics
        if: failure() && steps.gate.outputs.deploy == 'true'
        run: |
          SVC="${{ env.KOYEB_SERVICE_ID }}"
          koyeb service describe "$SVC" || true
          koyeb deployments list --service "$SVC" || true
          koyeb instances list --service "$SVC" || true

      - name: Health check and smoke tests
        if: steps.gate.outputs.deploy == 'true'
        run: bash .github/scripts/health-check.sh "${{ env.FRONTEND_URL }}"
      # Its own script (health-check.sh is shared with backend-deploy.yml), after the
      # health gate: a service not serving yet would fail here for the wrong reason.
      - name: Verify serve-time API-base rewrite
        if: steps.gate.outputs.deploy == 'true'
        run: bash .github/scripts/verify-served-bundle.sh "${{ env.FRONTEND_URL }}" "${{ env.API_ORIGIN }}"
      - name: Job summary
        if: always()
        run: |
          echo "## Frontend Deployment – Koyeb" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.gate.outputs.deploy }}" != "true" ]; then
            echo "- **Skipped:** test, lint or CI-only merge; the live site keeps the previous build" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "- **Service:** \`${{ env.KOYEB_SERVICE_ID }}\`"
            echo "- **Image:** \`${{ steps.img.outputs.image_ref }}\`"
            echo "- **URL:** ${{ env.FRONTEND_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
