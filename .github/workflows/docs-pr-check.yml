# =============================================================================
# docs-pr-check.yml - pull request gate for the documentation
# Usage: runs on every pull request; its first job (claimant-gate.yml) skips the
#        site job when the pull request touches no docs path (the docs entries
#        of backend-ci.yml's push filter, this file included).
# Produces: the check build-and-test-docs, one of the three branch protection
#        requires on main (backend ADR-0019). It builds the site as docs-build.yml
#        does, minus the coverage reports (CI artifacts) and TypeDoc (it needs the
#        frontend install), checks every internal link, and requires the YAML lint
#        (yaml-lint.yml, skipped unless a checked YAML file changed) and the
#        OpenAPI drift check (openapi-drift.yml, skipped unless the spec
#        changed). Nothing is uploaded or deployed.
#
# Failure mode: a page that fails to render, a Mermaid loading mismatch, a
# broken internal link, a YAML finding or OpenAPI drift fails build-and-test-docs
# and blocks the merge. Nothing is published either way.
# =============================================================================
name: Docs PR Check

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: docs-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/claimant-gate.yml
    with:
      claimant: docs

  docs:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # The image, not ubuntu-latest: pandoc comes from the Ubuntu archive, and 24.04
    # has exactly 3.1.3+ds-2; on the next LTS that version is gone, so moving the
    # OS is a scheduled change.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same pinned tools as docs-build.yml, from one place. No frontend install
      # here (no TypeDoc), so no npm pin and no frontend npm cache.
      - name: Docs toolchain
        uses: ./.github/actions/docs-toolchain
        with:
          redoc: 'true'
          pandoc: 'true'

      # No coverage and no TypeDoc input here by design; build-docs.sh skips them.
      - name: Build docs site
        run: bash .github/scripts/docs/build-docs.sh .

      # A page loads Mermaid exactly when it draws a diagram.
      #   PASSES when every built page agrees. FAILS on a page that draws without
      #   loading it or loads it without drawing, and on a site with no page.
      - name: Check which pages load Mermaid
        run: bash .github/scripts/docs/check-mermaid-pages.sh target/docs

      - name: Stage the site for link checking
        run: |
          mkdir -p target/link-check
          cp -r target/docs target/link-check/inventory-service

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --config lychee.toml
            --root-dir "${{ github.workspace }}/target/link-check"
            "target/link-check/inventory-service/**/*.html"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Docs PR Check"
            echo "- Site built and internal links checked; nothing published."
          } >> "$GITHUB_STEP_SUMMARY"

  yaml-lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/yaml-lint.yml

  # The OpenAPI spec against the controllers and DTOs; skipped unless the pull
  # request changes the spec (gate inside openapi-drift.yml).
  openapi-drift:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/openapi-drift.yml

  # The only job branch protection sees: fails when the gate failed, the site
  # job did not succeed or the lint or drift check failed or was cancelled;
  # passes a skipped lint or drift check, and passes when the gate found no docs
  # path (backend ADR-0019).
  build-and-test:
    name: build-and-test-docs
    needs: [changes, docs, yaml-lint, openapi-drift]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the site job, the YAML lint and the drift check
        run: |
          set -eu
          echo "gate=${{ needs.changes.result }}/${{ needs.changes.outputs.run }} docs=${{ needs.docs.result }} yaml-lint=${{ needs.yaml-lint.result }} openapi-drift=${{ needs.openapi-drift.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          [ "${{ needs.changes.outputs.run }}" = "false" ] && exit 0
          [ "${{ needs.docs.result }}" = "success" ] || exit 1
          for r in "${{ needs.yaml-lint.result }}" "${{ needs.openapi-drift.result }}"; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
