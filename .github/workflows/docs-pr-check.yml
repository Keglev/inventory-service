# =============================================================================
# Smart Supply Pro – Docs PR Check
#
# Pull request gate for documentation changes. Builds the docs site exactly as
# docs-pipeline.yml does (minus coverage and TypeDoc, which come from CI
# artifacts) and checks that every internal link resolves. Nothing is uploaded
# or deployed from this workflow. Its job is named build-and-test so it
# satisfies the required status check for docs-only pull requests; the trigger
# paths below must stay identical to the docs entries in the paths-ignore list
# of 1-ci-test.yml. This file itself is absent from that list on purpose, so
# editing the docs gate also runs the backend suite.
# =============================================================================
name: Docs PR Check

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - '.github/scripts/docs/**'
      - '.github/workflows/docs-pipeline.yml'
      - 'lychee.toml'
      - '.github/workflows/docs-pr-check.yml'
  workflow_dispatch:

concurrency:
  group: docs-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Pinned to the image, not to a moving label. This job installs pandoc from the
    # Ubuntu archive, and 24.04 publishes exactly one pandoc: 3.1.3+ds-2. When
    # ubuntu-latest migrates to the next LTS that version is simply not there, so
    # the OS is fixed here and the migration becomes something to schedule.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Pin npm version
        run: |
          npm install -g npm@11.10.1
          echo "npm: $(npm --version)"

      # Pinned 2026-09-04. This CLI renders the published API reference; unpinned, the
      # docs picked up whatever the registry served that minute — 2.51.1 was published
      # the same day. No known-good version could be preferred: the rendered HTML
      # records the bundled renderer, not the tool that ran it. Bump deliberately and
      # check the output.
      - name: Install ReDoc CLI
        run: |
          set -euo pipefail
          npm install -g @redocly/cli@2.51.1
          echo "redocly: $(redocly --version)"

      # Pinned 2026-09-04 to the version that rendered every page currently published.
      # This is not a downgrade or a freeze on something stale: Ubuntu 24.04 publishes
      # exactly one pandoc, 3.1.3+ds-2, in the frozen Release pocket since 2024-01-08,
      # with nothing in updates or security. Naming it changes what apt installs not at
      # all; it makes the dependency visible, and a security update arriving as a new
      # version fails loudly here instead of silently re-rendering 64 pages. Pandoc
      # converts those pages through a Lua filter, so its version is published output.
      - name: Install Pandoc
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y pandoc=3.1.3+ds-2
          pandoc --version | head -n 1

      # Coverage and TypeDoc inputs are absent here by design; build-docs.sh skips them.
      - name: Build docs site
        run: bash .github/scripts/docs/build-docs.sh .

      - name: Stage the site for link checking
        run: |
          mkdir -p target/link-check
          cp -r target/docs target/link-check/inventory-service

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --config lychee.toml
            --root-dir "${{ github.workspace }}/target/link-check"
            "target/link-check/inventory-service/**/*.html"

      - name: Job summary
        if: always()
        run: |
          echo "## Docs PR Check" >> $GITHUB_STEP_SUMMARY
          echo "- Site built and internal links checked; nothing published." >> $GITHUB_STEP_SUMMARY
