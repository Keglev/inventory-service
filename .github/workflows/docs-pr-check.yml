# =============================================================================
# Smart Supply Pro – Docs PR Check
#
# Pull request gate for documentation changes. Builds the docs site exactly as
# docs-build.yml does (minus coverage and TypeDoc, which come from CI
# artifacts) and checks that every internal link resolves. Nothing is uploaded
# or deployed from this workflow. Its last job is named build-and-test so it
# satisfies the required status check for docs-only pull requests: it requires
# the site job and the YAML lint (yaml-lint.yml, skipped unless a checked YAML
# file changed, such as docs-build.yml or this file). The trigger paths below
# must stay identical to the docs entries in the paths-ignore list of
# backend-ci.yml, this file included. A pull request editing this file is
# therefore reported by this workflow alone, which is the intent: the docs gate
# checks itself.
# =============================================================================
name: Docs PR Check

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - '.github/scripts/docs/**'
      - '.github/actions/docs-toolchain/**'
      - '.github/workflows/docs-build.yml'
      - 'lychee.toml'
      - '.github/workflows/docs-pr-check.yml'
  workflow_dispatch:

concurrency:
  group: docs-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    # Pinned to the image, not to a moving label. This job installs pandoc from the
    # Ubuntu archive, and 24.04 publishes exactly one pandoc: 3.1.3+ds-2. When
    # ubuntu-latest migrates to the next LTS that version is simply not there, so
    # the OS is fixed here and the migration becomes something to schedule.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same pinned tools as docs-build.yml, from one place. No frontend
      # install here (TypeDoc comes from CI artifacts), so no npm pin and no
      # frontend npm cache (W3, W4).
      - name: Docs toolchain
        uses: ./.github/actions/docs-toolchain
        with:
          redoc: 'true'
          pandoc: 'true'

      # Coverage and TypeDoc inputs are absent here by design; build-docs.sh skips them.
      - name: Build docs site
        run: bash .github/scripts/docs/build-docs.sh .

      - name: Stage the site for link checking
        run: |
          mkdir -p target/link-check
          cp -r target/docs target/link-check/inventory-service

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --config lychee.toml
            --root-dir "${{ github.workspace }}/target/link-check"
            "target/link-check/inventory-service/**/*.html"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Docs PR Check"
            echo "- Site built and internal links checked; nothing published."
          } >> "$GITHUB_STEP_SUMMARY"

  yaml-lint:
    uses: ./.github/workflows/yaml-lint.yml

  # The only job branch protection sees: fails when the site job did not
  # succeed or the lint failed or was cancelled; passes a skipped lint.
  build-and-test:
    needs: [docs, yaml-lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the site job and the YAML lint
        run: |
          set -eu
          echo "docs=${{ needs.docs.result }} yaml-lint=${{ needs.yaml-lint.result }}"
          [ "${{ needs.docs.result }}" = "success" ] || exit 1
          case "${{ needs.yaml-lint.result }}" in success|skipped) ;; *) exit 1 ;; esac
