# =============================================================================
# frontend-ci.yml - audits, lints, tests, builds and scans the frontend (claimant)
# Usage: runs on pushes to main that touch frontend/, ops/nginx or a script it
#        runs, and on every pull request; its first job (claimant-gate.yml)
#        skips the rest on a pull request outside those paths.
# Produces: the check build-and-test-frontend (backend ADR-0019). The job audits
#        the shipped dependency tree, lints, runs Vitest outside Docker (for
#        annotations), builds the nginx + Vite image into the runner's daemon,
#        verifies its HTTP contract and scans it with Trivy on the backend's
#        terms. A pull request stops there; a push to main publishes the image
#        to Docker Hub, tagged by commit SHA, and frontend-deploy.yml follows.
#
# Failure mode: the audit, lint, unit-test or CVE gate above, a broken image
# contract, a failed browser suite or a YAML finding fails build-and-test-frontend.
# A pull request cannot merge; on main nothing is published and frontend-deploy.yml
# does not start.
# =============================================================================
name: Frontend CI - Build & Test

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'ops/nginx/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/scripts/verify-image-contract.sh'
      - '.github/scripts/report-dependency-tree.sh'
      - '.github/scripts/frontend-ci-summary.sh'
      - '.github/actions/image-sbom-scan/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Read scope only: this workflow publishes to Docker Hub with DOCKER_PASSWORD, never
# to GHCR, so GITHUB_TOKEN needs no package write (backend-docker asks for that at
# job level).
permissions:
  contents: read

# One frontend build at a time, never cancelled mid-run (broken image state). The
# group spans every branch, so queue: max: with one pending slot GitHub would cancel
# another pull request's required check.
concurrency:
  group: frontend-ci
  cancel-in-progress: false
  queue: max

env:
  # The Docker Hub account name is configuration, not a credential (every public
  # image page prints it); as a secret it would be masked in every log, an ordinary
  # word turned into ***. DOCKER_PASSWORD stays a secret.
  IMAGE_NAME: ckbuzin/ssp-frontend
  # Pinned so local and CI environments stay aligned; update intentionally
  NPM_VERSION: '11.10.1'
  # Backend API base baked into the Vite production bundle
  VITE_API_BASE: https://api.smartsupplypro.de

# A pull request runs everything but the two Docker Hub steps, so a scan finding
# fails the required check at review. Only push events log in and publish: an
# unmerged branch cannot move :latest, and a fork's pull request needs no secret.
jobs:
  changes:
    uses: ./.github/workflows/claimant-gate.yml
    with:
      claimant: frontend

  frontend:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First after checkout, so a Dockerfile finding fails in seconds. Pinned by tag,
      # not digest, for the reason in backend-ci.yml.
      - name: Lint the Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1-alpine < frontend/Dockerfile

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      # npm version drift causes lockfile metadata churn; pin to keep CI deterministic
      - name: Pin npm version
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          echo "npm: $(npm --version)"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The backend image is scanned by Trivy with a hard fail on fixed
      # CRITICAL and HIGH findings; this is the frontend's equivalent, and it
      # is deliberately scoped the same way, to what actually ships.
      #   PASSES when no dependency reachable from "dependencies" carries an
      #     advisory of high severity or above.
      #   FAILS when one does, at which point the job stops before lint.
      #   DOES NOT CHECK devDependencies. A Vitest or ESLint advisory is real
      #     but it does not reach a browser, and a gate that blocks an
      #     unrelated merge on one gets ignored or removed. The step below
      #     reports the full tree instead.
      - name: Audit dependencies that ship (gate)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # Runs even when the gate above fails, so the failure arrives with the
      # full picture attached rather than an exit code alone.
      - name: Report the full dependency tree
        if: always()
        run: bash .github/scripts/report-dependency-tree.sh

      # Before the tests: the cheapest failure, and frontend/coverage/ does not exist
      # yet. Errors and warnings both fail the job (--max-warnings 0).
      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      # Tests run outside Docker so failures appear as inline GitHub annotations
      - name: Run unit tests (Vitest)
        working-directory: frontend
        env:
          CI: "true"
        run: npx vitest --reporter=default --reporter=github-actions --run --coverage
      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: frontend/coverage/
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Only the publish path needs this credential; a pull request pulls its base
      # images anonymously. If the anonymous pull limit bites, log in on every event
      # here rather than stop scanning pull requests.
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ckbuzin
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ env.IMAGE_NAME }}
          # :latest is a published coordinate and this job builds images it does not
          # publish, so is_default_branch keeps it off a pull-request build, which is
          # tagged by SHA and never leaves the runner.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}
      # Context: the repository root (ops/nginx). Exported to the runner's daemon only;
      # publishing is the job's last step, after the scan. provenance is set because a
      # daemon export cannot carry attestations: the default would be inoperative.
      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          provenance: false
          build-args: |
            VITE_API_BASE=${{ env.VITE_API_BASE }}
            VITE_BUILD_ID=${{ github.sha }}
            VITE_APP_ENVIRONMENT=Production (Koyeb)
            NPM_VERSION=${{ env.NPM_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Without the local image Trivy would fall back to the registry, where the tag
      # does not exist yet, and fail on a pull error dressed up as a scan failure.
      - name: Confirm the image reached the local daemon
        run: |
          set -euo pipefail
          docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}" --format 'local image id {{.Id}}'

      # Starts the image just built and asserts its HTTP contract (frontend ADR-0011):
      # the browser suite's vite preview runs none of ops/nginx. The selftest runs
      # first, every comparison against a value that must fail.
      #   PASSES when the contract holds and the nginx master (PID 1) runs as UID 101.
      #   FAILS on any assertion or another UID, so a root image cannot pass.
      #   DOES NOT CHECK the proxy locations (production); health-check.sh covers /api/.
      - name: Verify the image HTTP contract
        run: |
          set -euo pipefail
          docker run -d --rm --name ssp-frontend-contract -p 8080:8080 \
            "${IMAGE_NAME}:${GITHUB_SHA}"
          trap 'docker rm -f ssp-frontend-contract >/dev/null 2>&1 || true' EXIT
          # nginx resets the first connections while it starts; only the last
          # attempt prints curl's reason, so a green log carries no error line.
          for attempt in $(seq 1 30); do
            if curl -fs -o /dev/null http://127.0.0.1:8080/; then break; fi
            if [ "$attempt" -eq 30 ]; then
              curl -fsS -o /dev/null http://127.0.0.1:8080/ || true
              echo "::error::the image did not start serving within 30 seconds"
              exit 1
            fi
            sleep 1
          done
          docker exec ssp-frontend-contract nginx -t
          master_uid=$(docker exec ssp-frontend-contract awk '/^Uid:/ {print $2}' /proc/1/status)
          if [ "$master_uid" != 101 ]; then
            echo "::error::the nginx master runs as UID $master_uid, not 101"
            exit 1
          fi
          bash .github/scripts/verify-image-contract.sh --selftest http://127.0.0.1:8080
          bash .github/scripts/verify-image-contract.sh http://127.0.0.1:8080

      # SBOM and CVE gate, one Trivy analysis (the action's banner says why the SBOM
      # comes first); the same action and terms as the backend image.
      #   PASSES when the SBOM holds the image's Alpine packages and the image
      #     carries no HIGH or CRITICAL CVE with a published fix.
      #   FAILS the job before the publishing step, so the image never leaves the
      #     runner and frontend-deploy does not run; on a pull request it fails the
      #     required check.
      #   DOES NOT CHECK findings with no fix available (ignore-unfixed).
      # The SBOM is kept as an artifact only for an image that is published.
      - name: SBOM and CVE gate (Trivy)
        uses: ./.github/actions/image-sbom-scan
        with:
          image-ref: docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          name: frontend
          sha: ${{ github.sha }}
          required-purl: 'pkg:apk/'
          upload: ${{ github.event_name != 'pull_request' }}

      # The only step that changes anything outside the runner, last on purpose: every
      # tag moves at once, latest included, so a tag names an image that passed the
      # scan. A daemon push is single-platform; resolve-image-digest.sh takes both manifest types.
      - name: Publish image to Docker Hub
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "==> $tag"
            docker push "$tag"
          done <<< "$TAGS"

      - name: Job summary
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/frontend-ci-summary.sh

  # The suite runs beside the frontend job, not after it: it builds its own bundle
  # and its own backend. Skipped when the gate inside it finds nothing to see.
  e2e:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/e2e-playwright.yml

  # YAML hygiene and actionlint; skipped unless the pull request changes a
  # checked YAML file (gate inside yaml-lint.yml).
  yaml-lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/yaml-lint.yml

  # The only job branch protection sees: fails when the gate or a job above failed
  # or was cancelled, so a red browser suite stops the deploy chain (backend
  # ADR-0016); passes a skipped suite or lint, and run=false (backend ADR-0019).
  build-and-test:
    name: build-and-test-frontend
    needs: [changes, frontend, e2e, yaml-lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the frontend job, the browser suite and the YAML lint
        run: |
          set -eu
          echo "gate=${{ needs.changes.result }}/${{ needs.changes.outputs.run }} frontend=${{ needs.frontend.result }} e2e=${{ needs.e2e.result }} yaml-lint=${{ needs.yaml-lint.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          [ "${{ needs.changes.outputs.run }}" = "false" ] && exit 0
          [ "${{ needs.frontend.result }}" = "success" ] || exit 1
          for r in "${{ needs.e2e.result }}" "${{ needs.yaml-lint.result }}"; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
