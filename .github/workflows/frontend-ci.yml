# =============================================================================
# Smart Supply Pro – Frontend CI
#
# Triggers on push/PR to main when frontend or Nginx config files change, or
# one of the three scripts this workflow runs.
# Audits the installed dependency tree, then runs ESLint, then Vitest unit tests
# outside Docker to get GitHub annotation support. An advisory of high severity
# or above in a dependency that ships to the browser fails the job; lint errors
# fail it too. Both block the merge through the build-and-test check.
# Builds a Docker image (Nginx + Vite bundle) into the runner's Docker daemon
# and scans it with Trivy on the same terms as the backend image. A fixed CVE
# of high severity or above fails the job. Pull requests build and scan too and
# stop there; only a push to main publishes to Docker Hub, tagged by commit
# SHA, and only once the scan has passed.
# On success, triggers: frontend-deploy.yml (Koyeb deployment).
# =============================================================================
name: Frontend CI - Build & Test

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'ops/nginx/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/scripts/verify-image-contract.sh'
      - '.github/scripts/report-dependency-tree.sh'
      - '.github/scripts/frontend-ci-summary.sh'
      - '.github/actions/image-sbom-scan/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'ops/nginx/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/scripts/verify-image-contract.sh'
      - '.github/scripts/report-dependency-tree.sh'
      - '.github/scripts/frontend-ci-summary.sh'
      - '.github/actions/image-sbom-scan/**'
  workflow_dispatch:

# Read scope only. This workflow publishes to Docker Hub, authenticated with
# DOCKER_PASSWORD, and never to the GitHub container registry, so GITHUB_TOKEN
# needs no write access to the GitHub package namespace. backend-docker is
# the workflow that does publish there, and it asks for that scope at job
# level rather than for the whole file.
permissions:
  contents: read

# Only one frontend build at a time — do not cancel in progress to avoid broken image state.
# The group is shared by every branch, so without queue: max GitHub kept one
# pending run and cancelled it when the next PR pushed: on 2026-10-09 a PR's
# required check was cancelled that way and had to be re-run.
concurrency:
  group: frontend-ci
  cancel-in-progress: false
  queue: max

env:
  # The Docker Hub account name is configuration, not a credential: it is
  # printed on every public image page. Held as a secret it was masked
  # everywhere it appeared, which is how #99 turned a successful deploy into a
  # log reading "4 *** Backend to Hetzner". DOCKER_PASSWORD stays a secret.
  IMAGE_NAME: ckbuzin/ssp-frontend
  # Pinned so local and CI environments stay aligned; update intentionally
  NPM_VERSION: '11.10.1'
  # Backend API base baked into the Vite production bundle
  VITE_API_BASE: https://api.smartsupplypro.de

# A pull request runs everything except the two steps that talk to Docker Hub:
# it builds the image, scans it, and fails the required build-and-test check
# when the scan finds a fixed CVE of high severity or above. The finding
# arrives at the review rather than at the merge, which is only affordable
# because building an image is no longer the same step as publishing one.
#
# The registry login and the publish step stay gated to push events. An
# unmerged branch therefore cannot move :latest, and a pull request from a
# fork, which carries no secrets, still runs the whole gate, because nothing on
# the pull-request path needs a credential.
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First step after checkout so a Dockerfile finding fails in seconds
      # instead of after the install, the audit, the lint and the test suite.
      # Pinned by version tag rather than digest, for the reason given in
      # backend-ci.yml where the backend Dockerfile is linted.
      - name: Lint the Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1-alpine < frontend/Dockerfile

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      # npm version drift causes lockfile metadata churn; pin to keep CI deterministic
      - name: Pin npm version
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          echo "npm: $(npm --version)"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The backend image is scanned by Trivy with a hard fail on fixed
      # CRITICAL and HIGH findings; this is the frontend's equivalent, and it
      # is deliberately scoped the same way, to what actually ships.
      #   PASSES when no dependency reachable from "dependencies" carries an
      #     advisory of high severity or above.
      #   FAILS when one does, at which point the job stops before lint.
      #   DOES NOT CHECK devDependencies. A Vitest or ESLint advisory is real
      #     but it does not reach a browser, and a gate that blocks an
      #     unrelated merge on one gets ignored or removed. The step below
      #     reports the full tree instead.
      - name: Audit dependencies that ship (gate)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # Runs even when the gate above fails, so the failure arrives with the
      # full picture attached rather than an exit code alone.
      - name: Report the full dependency tree
        if: always()
        run: bash .github/scripts/report-dependency-tree.sh

      # Lint before the tests: it is the cheapest failure, and at this point
      # frontend/coverage/ does not exist yet, so no generated Istanbul file is
      # linted. Errors fail the job; warnings do not gate yet.
      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      # Tests run outside Docker so failures appear as inline GitHub annotations
      - name: Run unit tests (Vitest)
        working-directory: frontend
        env:
          CI: "true"
        run: npx vitest --reporter=default --reporter=github-actions --run --coverage
      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: frontend/coverage/
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Only the publish step needs this credential, so only the publish path
      # asks for it. A build on a pull request pulls its base images
      # anonymously. If Docker Hub's anonymous pull limit ever bites on a shared
      # runner address, the answer is to log in on every event here, not to stop
      # scanning pull requests.
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ckbuzin
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ env.IMAGE_NAME }}
          # :latest is a published coordinate and this job now builds images it
          # does not publish, so is_default_branch keeps that tag off a
          # pull-request build. Such a build is tagged by SHA and goes no
          # further than the runner that made it.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}
            type=sha
      # Build context is repo root so the Dockerfile can access ops/nginx config
      #
      # The image is exported to the runner's Docker daemon and goes no further
      # until the scan below has passed; publishing is the last step of the job.
      # Until 2026-09-14 this step published all three tags and Trivy ran
      # afterwards, so a rejected image was already on a public registry by the
      # time the gate fired, `latest` among the tags that had moved to it. The
      # deploy was blocked either way, because frontend-deploy runs only on
      # this job's success; the registry was not.
      #
      # provenance is written down rather than left at its default. Attestations
      # are produced by the registry exporter, and a daemon export cannot carry
      # them, so the default is inoperative here rather than merely unused. The
      # index that used to be published carried one and nothing in this
      # repository ever read it.
      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          provenance: false
          build-args: |
            VITE_API_BASE=${{ env.VITE_API_BASE }}
            VITE_BUILD_ID=${{ github.sha }}
            VITE_APP_ENVIRONMENT=Production (Koyeb)
            NPM_VERSION=${{ env.NPM_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Trivy reads the local daemon for a reference it can find there. If the
      # export above had silently not happened, it would fall back to the
      # registry, where this tag does not exist yet, and the job would fail on a
      # pull error dressed up as a scan failure. Fail on the missing image
      # instead, where the message says what is wrong.
      - name: Confirm the image reached the local daemon
        run: |
          set -euo pipefail
          docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}" --format 'local image id {{.Id}}'

      # The Playwright suite runs the bundle under `vite preview`, which serves
      # dist/ directly and executes none of ops/nginx. The SPA fallback, the
      # asset 404, the caching headers and the four security headers that
      # default.conf repeats in three locations were therefore proven nowhere.
      # This starts the image just built and asserts that contract over HTTP.
      #   The selftest runs first, against the same container: it puts each
      #   comparison against a value that must fail, so a gate that can no
      #   longer fail cannot pass in silence.
      #   The nginx master is PID 1; its UID must be 101, the unprivileged user
      #   the Dockerfile selects. PASSES at 101; FAILS on any other UID, so an
      #   image that falls back to root cannot pass on its HTTP answers alone.
      #   The proxy locations are deliberately not exercised. They proxy_pass to
      #   the production backend, and /api/ is proven after deploy by
      #   health-check.sh instead.
      # Recorded in ADR-0011, which lands in the next commit of this wave.
      - name: Verify the image HTTP contract
        run: |
          set -euo pipefail
          docker run -d --rm --name ssp-frontend-contract -p 8080:8080 \
            "${IMAGE_NAME}:${GITHUB_SHA}"
          trap 'docker rm -f ssp-frontend-contract >/dev/null 2>&1 || true' EXIT
          # nginx resets the first connections while it starts; only the last
          # attempt prints curl's reason, so a green log carries no error line.
          for attempt in $(seq 1 30); do
            if curl -fs -o /dev/null http://127.0.0.1:8080/; then break; fi
            if [ "$attempt" -eq 30 ]; then
              curl -fsS -o /dev/null http://127.0.0.1:8080/ || true
              echo "::error::the image did not start serving within 30 seconds"
              exit 1
            fi
            sleep 1
          done
          docker exec ssp-frontend-contract nginx -t
          master_uid=$(docker exec ssp-frontend-contract awk '/^Uid:/ {print $2}' /proc/1/status)
          if [ "$master_uid" != 101 ]; then
            echo "::error::the nginx master runs as UID $master_uid, not 101"
            exit 1
          fi
          bash .github/scripts/verify-image-contract.sh --selftest http://127.0.0.1:8080
          bash .github/scripts/verify-image-contract.sh http://127.0.0.1:8080

      # The image's SBOM and CVE gate, one Trivy analysis (the action's banner
      # records why the SBOM comes first). Same action and terms as the backend
      # image, so the two images are held to one standard.
      #   PASSES when the SBOM holds the image's Alpine packages and the image
      #     carries no HIGH or CRITICAL CVE with a published fix.
      #   FAILS the job before the publishing step below runs, so the image
      #     never leaves the runner, and stops frontend-deploy with it: that
      #     workflow runs only when this one concludes success. On a pull
      #     request the same failure lands on the required build-and-test check.
      #   DOES NOT CHECK findings with no fix available (ignore-unfixed).
      # The SBOM is kept as an artifact only for an image that is published.
      - name: SBOM and CVE gate (Trivy)
        uses: ./.github/actions/image-sbom-scan
        with:
          image-ref: docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          name: frontend
          sha: ${{ github.sha }}
          required-purl: 'pkg:apk/'
          upload: ${{ github.event_name != 'pull_request' }}

      # The only step in this job that changes anything outside the runner, and
      # deliberately the last one. Every tag the metadata step produced is moved
      # at once, `latest` included, so a tag on this repository names an image
      # that passed the scan above rather than one that was merely built.
      #
      # A daemon push publishes a single-platform manifest where the previous
      # arrangement published an OCI index. frontend-deploy deploys whatever
      # digest the tag resolves to and resolve-image-digest.sh asks for both
      # media types, so the handoff is unchanged; the digest itself is a
      # different one from what the same image would have carried before.
      - name: Publish image to Docker Hub
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "==> $tag"
            docker push "$tag"
          done <<< "$TAGS"

      - name: Job summary
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/frontend-ci-summary.sh

  # The suite runs beside the frontend job, not after it: it builds its own bundle
  # and its own backend. Skipped when the gate inside it finds nothing to see.
  e2e:
    uses: ./.github/workflows/e2e-playwright.yml

  # The only job branch protection sees. It fails when either job above failed
  # or was cancelled, and passes when the suite was skipped, so a red browser
  # suite fails this run and the deploy chain never starts (ADR-0016).
  build-and-test:
    needs: [frontend, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the frontend job and the browser suite
        run: |
          set -eu
          echo "frontend=${{ needs.frontend.result }} e2e=${{ needs.e2e.result }}"
          [ "${{ needs.frontend.result }}" = "success" ] || exit 1
          case "${{ needs.e2e.result }}" in success|skipped) ;; *) exit 1 ;; esac
