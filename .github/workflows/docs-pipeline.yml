# =============================================================================
# Smart Supply Pro – Documentation Pipeline
#
# Builds and packages all project documentation into the docs-site artifact.
# Triggered after backend or frontend CI succeeds, or on docs-only pushes.
# On success, triggers: 3-deploy-ghpages.yml (publishes to GitHub Pages).
#
# Artifacts consumed: jacoco-html-{SHA}            (from 1-ci-test.yml, optional)
#                     frontend-coverage-html-{SHA}  (from 5-frontend-ci.yml, optional)
# Artifacts produced: docs-site                    (consumed by 3-deploy-ghpages.yml)
# =============================================================================
name: Docs Pipeline - OpenAPI & Architecture

on:
  workflow_run:
    workflows:
      - "1 Backend CI - Build & Test"
      - "5 Frontend CI - Build & Test"
    types: [completed]
    # Only CI runs on main feed the public docs site; PR runs must never publish.
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - '.github/scripts/docs/**'
      - '.github/workflows/docs-pipeline.yml'
      - 'lychee.toml'

permissions:
  contents: write
  actions: read

# Cancel in-progress builds when a newer commit arrives
concurrency:
  group: docs-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main')
      || github.event_name == 'push'
    # Pinned to the image, not to a moving label. This job installs pandoc from the
    # Ubuntu archive, and 24.04 publishes exactly one pandoc: 3.1.3+ds-2. When
    # ubuntu-latest migrates to the next LTS that version is simply not there, so
    # the OS is fixed here and the migration becomes something to schedule.
    runs-on: ubuntu-24.04

    steps:
      # Checkout the commit that triggered upstream CI, or HEAD for direct pushes.
      # Two commits, not the whole repository: this build reads no history, and a
      # full-depth checkout pulled every branch and every tag on every run for
      # nothing, measured at 8 to 9 seconds. Two rather than one keeps the merge's
      # parent present, so a diff of what a merge actually changed stays possible
      # without a second fetch; 2-docker-backend.yml checks out at this depth for
      # exactly that reason.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # Supports flat layout (pom.xml + docs/) and monorepo (backend/pom.xml + backend/docs/)
      - name: Detect project root
        id: where
        run: |
          set -euo pipefail
          if [ -f "pom.xml" ] && [ -d "docs" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "backend/pom.xml" ] && [ -d "backend/docs" ]; then
            echo "dir=backend" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No project root found (expected pom.xml + docs/)"
            exit 1
          fi

      # JaCoCo is only available when triggered after backend CI — absent on docs-only pushes
      - name: Download JaCoCo artifact
        if: >
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == '1 Backend CI - Build & Test'
        uses: actions/download-artifact@v8
        with:
          name: jacoco-html-${{ github.event.workflow_run.head_sha }}
          path: ${{ steps.where.outputs.dir }}/target/site/jacoco
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Frontend coverage is only available when triggered after frontend CI
      - name: Download frontend coverage artifact
        if: >
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == '5 Frontend CI - Build & Test'
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage-html-${{ github.event.workflow_run.head_sha }}
          path: ${{ steps.where.outputs.dir }}/target/frontend/coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The same cache declaration 5-frontend-ci.yml and 7-frontend-e2e.yml carry,
      # keyed on the same lockfile, so this job restores the tree those jobs have
      # already built instead of installing cold on every run. The lockfile has
      # changed 18 times in 1439 commits; only on those runs does every job miss
      # and one lose the race to write the entry, which is a warning and not a
      # failure. Every other run is an exact hit and writes nothing.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Pin npm version
        run: |
          npm install -g npm@11.10.1
          echo "npm: $(npm --version)"

      # Pinned 2026-09-04. This CLI renders the published API reference; unpinned, the
      # docs picked up whatever the registry served that minute — 2.51.1 was published
      # the same day. No known-good version could be preferred: the rendered HTML
      # records the bundled renderer, not the tool that ran it. Bump deliberately and
      # check the output.
      - name: Install ReDoc CLI
        run: |
          set -euo pipefail
          npm install -g @redocly/cli@2.51.1
          echo "redocly: $(redocly --version)"

      # Pinned 2026-09-04 to the version that rendered every page currently published.
      # This is not a downgrade or a freeze on something stale: Ubuntu 24.04 publishes
      # exactly one pandoc, 3.1.3+ds-2, in the frozen Release pocket since 2024-01-08,
      # with nothing in updates or security. Naming it changes what apt installs not at
      # all; it makes the dependency visible, and a security update arriving as a new
      # version fails loudly here instead of silently re-rendering 64 pages. Pandoc
      # converts those pages through a Lua filter, so its version is published output.
      - name: Install Pandoc
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y pandoc=3.1.3+ds-2
          pandoc --version | head -n 1

      # Install frontend deps so TypeDoc can generate markdown from source. The
      # previous form chained the install onto a directory test and then swallowed
      # whatever came back with a trailing echo, so a failed install and an absent
      # directory produced the same message and the same exit 0 and the build went
      # on to render a site from whatever happened to be there. That is the defect
      # the next step was fixed for in eee1b410. An absent frontend directory is
      # still tolerated; nothing else is.
      - name: Install frontend dependencies
        run: |
          set -euo pipefail
          if [ -d "frontend" ]; then
            cd frontend
            npm ci
          else
            echo "No frontend directory — skipping"
          fi

      # Blocking since 2026-09-04. This step swallowed failures while it printed 64
      # warnings on every run; a4088857 declared the project's block tags and took that
      # to zero, so a warning now means something changed. --treatWarningsAsErrors is
      # the part that bites: TypeDoc exits 0 when it only warns, which is how those 64
      # survived unnoticed. Measured: exit 0 on the clean baseline, exit 3 with a single
      # warning reintroduced.
      - name: Generate TypeDoc markdown
        run: |
          if [ -f "frontend/typedoc.json" ]; then
            cd frontend
            npx typedoc --options typedoc.json --treatWarningsAsErrors
          else
            echo "No frontend/typedoc.json — skipping TypeDoc"
          fi

      - name: Build docs site
        run: |
          PROJECT_DIR="${{ steps.where.outputs.dir }}"
          bash .github/scripts/docs/build-docs.sh "$PROJECT_DIR"

      # The site currently published, fetched one commit deep, so the assembly below
      # has something to lay this build over. A missing branch is tolerated and
      # nothing else is: before the first ever publish there is no gh-pages, and the
      # assembly then falls back to this build alone, which is what the pipeline did
      # unconditionally until now.
      - name: Fetch the published site
        run: |
          set -euo pipefail
          if git fetch --depth=1 origin gh-pages; then
            mkdir -p target/gh-pages
            git archive FETCH_HEAD | tar -x -C target/gh-pages
            echo "Published site: $(find target/gh-pages -type f | wc -l) files"
          else
            echo "::warning::No gh-pages branch found — assembling from this build alone"
          fi

      # What gets published is this build laid over the published site, one subtree
      # at a time. Every subtree is still rebuilt on every run, so this is expected
      # to change nothing today: the published output after this commit must be
      # byte-identical to the output before it. It earns its place once the build is
      # split into gated jobs, because a subtree a run did not rebuild is then
      # carried forward instead of vanishing.
      - name: Assemble the site to publish
        run: |
          bash .github/scripts/docs/assemble-site.sh \
            "${{ steps.where.outputs.dir }}" target/gh-pages

      # Same checker, same version and config as docs-pr-check.yml: the publishing
      # build must not disagree with the PR gate about what a broken link is. It
      # reads the assembled tree, so it checks the site that is about to be
      # published rather than a fragment of it.
      - name: Stage the site for link checking
        run: |
          mkdir -p target/link-check
          cp -r "${{ steps.where.outputs.dir }}/target/publish" target/link-check/inventory-service
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --config lychee.toml
            --root-dir "${{ github.workspace }}/target/link-check"
            "target/link-check/inventory-service/**/*.html"

      # The assembled tree, not the built one. 3-deploy-ghpages.yml replaces the
      # branch wholesale, so what it receives has to be a complete site.
      - name: Upload docs-site artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: ${{ steps.where.outputs.dir }}/target/publish