# =============================================================================
# Smart Supply Pro – Frontend E2E (Playwright)
#
# Contract (ADR-0009, frontend): run the browser suite against a LOCAL stack
# built from this commit. Backend = packaged jar on H2 in the `test,e2e`
# profile (seeded, demo reads on). Frontend = production bundle served by
# `vite preview` on 5173, the origin the backend's default CORS list admits.
# Nothing here touches Hetzner, Oracle, Koyeb or any secret.
#
# Reusable: backend-ci.yml and frontend-ci.yml call it as a job, so the suite
# runs inside the CI whose paths it covers and a red suite fails that CI run.
# The deploy chains trigger on a successful CI run, which is what makes this a
# release gate and not only a merge gate (ADR-0016). It carries no status check
# name of its own; the caller's aggregator job reports build-and-test.
#
# The suite was advisory until the precondition in ADR-0009 was met: that
# contract asked for ten green pull-request runs in a row, and the count stood at
# thirty on 2026-09-15. The amendment block on ADR-0009 records the promotion
# and this move.
#
# H2 is test-scoped and absent from the jar, so the backend is launched with
# the H2 driver on the parent classpath via Boot's JarLauncher (see the header
# of src/main/resources/application-e2e.yml). The version is the pom's H2 pin.
#
# Playwright browsers are cached under the resolved Playwright version. A cache
# hit installs the OS font packages only and downloads no browser.
# =============================================================================
name: E2E - Playwright Browser Suite

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  H2_VERSION: 2.3.232
  BACKEND_URL: http://localhost:8081
  # Same pin as frontend-ci.yml. Without it this job took whatever npm the
  # Node 24 image happened to ship, which is why the two jobs printed different
  # install warnings for the same lockfile on 2026-09-03.
  NPM_VERSION: '11.10.1'

jobs:
  # The callers trigger on wider path sets than the suite covers, so a commit
  # that cannot move the browser suite skips it instead of spending six minutes
  # proving nothing. The decision lives in a script because both the rule and
  # its reasons outgrew a workflow step.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Decide whether the suite is relevant
        id: decide
        run: bash .github/scripts/e2e-relevant.sh

  e2e-playwright:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # check-latest deliberately left at its default of false: same commit,
      # same JDK patch, every run. Full reasoning in backend-ci.yml. This job
      # packages a throwaway jar for the browser suite and ships nothing.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tests are the job of backend-ci; this job only needs a runnable jar
      - name: Package backend (no tests)
        run: mvn -q -B -Dmaven.test.skip=true package

      - name: Resolve H2 driver into the local repository
        run: mvn -q -B dependency:get -Dartifact=com.h2database:h2:${H2_VERSION}

      - name: Start backend (test,e2e profile)
        run: |
          JAR=$(ls target/inventory-service-*.jar | grep -v original | head -n 1)
          H2=$HOME/.m2/repository/com/h2database/h2/${H2_VERSION}/h2-${H2_VERSION}.jar
          test -f "$H2" || { echo "H2 driver missing at $H2"; exit 1; }
          nohup java -cp "$JAR:$H2" org.springframework.boot.loader.launch.JarLauncher \
            --spring.profiles.active=test,e2e > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # npm version drift causes lockfile metadata churn; pin to keep CI deterministic
      - name: Pin npm version
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          echo "npm: $(npm --version)"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The browsers are the largest download in this job: measured on
      # 2026-09-09, Chromium 184 MB, the headless shell 115 MB and FFmpeg 2 MB,
      # about 22 s, on every run. They change only when Playwright changes, so
      # the key is the resolved version rather than a hash of the lockfile: a
      # hash would discard three valid browsers whenever any unrelated
      # dependency moved. There are deliberately no restore-keys. A near miss
      # restores the previous version's directories, which Playwright ignores
      # and re-downloads, and both copies are then saved under the new key
      # against a cache budget this repository already watches (see the note
      # above the JDK step in backend-ci.yml).
      - name: Resolve the Playwright version
        id: playwright
        working-directory: frontend
        run: |
          set -euo pipefail
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright $version"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The font packages are apt-installed and outside the cached directory, so
      # they are fetched either way; only the browser download is skippable.
      - name: Install Chromium
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # The API origin is baked into the bundle at build time (VITE_API_BASE)
      - name: Build frontend against the local backend
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ env.BACKEND_URL }}
        run: npm run build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf "${BACKEND_URL}/actuator/health" | grep -q '"UP"'; then
              echo "backend healthy after $(((i-1)*2))s"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy"; tail -n 80 "$RUNNER_TEMP/backend.log"; exit 1

      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Stop backend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backend.pid" ]; then kill "$(cat "$RUNNER_TEMP/backend.pid")" || true; fi

      - name: Upload Playwright report and backend log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/backend.log
          retention-days: 7
