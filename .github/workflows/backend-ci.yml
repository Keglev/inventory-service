# =============================================================================
# backend-ci.yml - builds and tests the backend (the backend claimant)
# Usage: runs on every pull request (a required check that never reports blocks
#        the merge) and on pushes to main through the path filter below. Its
#        first job (claimant-gate.yml) skips the rest on a pull request outside
#        the backend family: every path the frontend and docs families do not
#        claim, README.md and LICENSE included; claimant-gate.sh repeats the list.
# Produces: the check build-and-test-backend, one of the three branch protection
#        requires on main (backend ADR-0019), the JaCoCo report artifact, and on
#        main the run backend-docker.yml chains on.
#
# Failure mode: a hadolint finding, a failing test, coverage under the JaCoCo
# floor, a failed browser suite or a YAML finding fails its job, and
# build-and-test-backend fails with it. On a pull request that blocks the merge; on
# main backend-docker.yml does not start, so no image is built or released.
# =============================================================================
name: Backend CI - Build & Test

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'frontend/**'
      - 'ops/nginx/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/scripts/verify-image-contract.sh'
      - '.github/scripts/report-dependency-tree.sh'
      - '.github/scripts/frontend-ci-summary.sh'
      - '.github/actions/image-sbom-scan/**'
      - 'docs/**'
      - '.github/scripts/docs/**'
      - '.github/actions/docs-toolchain/**'
      - '.github/workflows/docs-build.yml'
      - 'lychee.toml'
      - '.github/workflows/docs-pr-check.yml'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A pull request's runs cancel each other (its newest commit needs the verdict);
# main runs queue in order: the image gate compares a commit with its parent only,
# so a dropped main run would leave a change unbuilt. queue: max keeps them all.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  queue: ${{ github.ref == 'refs/heads/main' && 'max' || 'single' }}

# Read scope for every job, the called browser suite included, stated here so it
# does not depend on the repository default. The backend job repeats it.
permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/claimant-gate.yml
    with:
      claimant: backend

  backend:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Here, not in backend-docker (no pull_request trigger), so a finding stops the
      # merge, not a release. Pinned by tag, not digest: Dependabot reads Dockerfiles,
      # not run: lines. Kept warnings carry inline `hadolint ignore=` with reasons.
      - name: Lint the Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1-alpine < Dockerfile

      # setup-java's maven cache is the only one: a second ~/.m2 cache on the same pom
      # hash misses and saves with it. check-latest stays false, so a commit resolves
      # the same JDK patch every run; this JDK only runs tests (the image builds the jar).
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # No secrets on purpose: application-test.yml supplies H2 and a test Google client.
      # An OAuth2 variable here would outrank that profile (relaxed binding), and arrive
      # empty on a Dependabot pull request; DB_* feed only the base datasource (replaced).
      - name: Build and test
        run: |
          set -euo pipefail
          mvn clean verify -Dspring.profiles.active=test

      - name: Upload JaCoCo coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/site/jacoco/
          retention-days: 30

      # Only on failure: each class's .txt report carries the exception and stack trace,
      # one artifact instead of a search through the whole log. warn, not error, when
      # there are no files: a compilation failure writes no reports.
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/surefire-reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Backend Build & Test"
            echo "- **Coverage artifact:** \`jacoco-html-${{ github.event.pull_request.head.sha || github.sha }}\`"
            echo "- **Next:** \`backend-docker.yml\` builds and scans the Docker image"
          } >> "$GITHUB_STEP_SUMMARY"

  # The suite runs beside the backend job, not after it: it builds its own jar
  # and its own bundle. Skipped when the gate inside it finds nothing to see,
  # and on a pull request frontend-ci also checks (frontend-ci runs it there).
  e2e:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/e2e-playwright.yml
    with:
      caller: backend-ci

  # YAML hygiene and actionlint; skipped unless the pull request changes a
  # checked YAML file (gate inside yaml-lint.yml).
  yaml-lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/yaml-lint.yml

  # The only job branch protection sees: fails when the gate or a job above failed
  # or was cancelled, so a red browser suite stops the deploy chain (backend
  # ADR-0016); passes a skipped suite or lint, and run=false (backend ADR-0019).
  build-and-test:
    name: build-and-test-backend
    needs: [changes, backend, e2e, yaml-lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the backend job, the browser suite and the YAML lint
        run: |
          set -eu
          echo "gate=${{ needs.changes.result }}/${{ needs.changes.outputs.run }} backend=${{ needs.backend.result }} e2e=${{ needs.e2e.result }} yaml-lint=${{ needs.yaml-lint.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          [ "${{ needs.changes.outputs.run }}" = "false" ] && exit 0
          [ "${{ needs.backend.result }}" = "success" ] || exit 1
          for r in "${{ needs.e2e.result }}" "${{ needs.yaml-lint.result }}"; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
