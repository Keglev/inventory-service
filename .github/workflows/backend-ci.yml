# =============================================================================
# backend-ci.yml - Smart Supply Pro Backend Build & Test
#
# Compiles, tests, and generates JaCoCo coverage for the backend service.
# On success, triggers: backend-docker.yml (image build and scan).
#
# One of three merge gates. Its aggregator reports build-and-test-backend, one
# of the three checks branch protection requires on main; frontend-ci.yml and
# docs-pr-check.yml report the other two (W27, backend ADR-0019). It runs on
# every pull request, because a required check that never reports blocks the
# merge; its first job (claimant-gate.yml) decides whether the pull request
# touches the backend family, and on a pull request that does not, the other
# jobs are skipped and the check passes. The backend family is every path the
# frontend and docs families do not claim (README.md and LICENSE included);
# pushes to main keep the path filter below, and claimant-gate.sh repeats it.
#
# Failure mode: a hadolint finding, a failing test, coverage under the JaCoCo
# floor, a failed browser suite or a YAML finding fails its job, and
# build-and-test-backend fails with it. On a pull request that blocks the merge; on
# main backend-docker.yml does not start, so no image is built or released.
# =============================================================================
name: Backend CI - Build & Test

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'frontend/**'
      - 'ops/nginx/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/scripts/verify-image-contract.sh'
      - '.github/scripts/report-dependency-tree.sh'
      - '.github/scripts/frontend-ci-summary.sh'
      - '.github/actions/image-sbom-scan/**'
      - 'docs/**'
      - '.github/scripts/docs/**'
      - '.github/actions/docs-toolchain/**'
      - '.github/workflows/docs-build.yml'
      - 'lychee.toml'
      - '.github/workflows/docs-pr-check.yml'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A pull request's runs cancel each other: only the branch's newest commit needs
# a verdict. Runs on main never do. backend-docker's image gate compares a main
# commit with its parent only, so a cancelled main run left that commit without
# an image check (CI-1: #372's run was cancelled by #373's 61 s later and its
# change was never built on its own). queue: max keeps every pending main run in
# commit order; the default (single) keeps one and drops it for a newer one. It
# cannot be combined with cancel-in-progress: true, so both follow the branch.
# Both sides were probed with these expressions on a scratch branch (2026-10-19:
# three queued runs all ran in order; three cancelling runs left the newest).
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  queue: ${{ github.ref == 'refs/heads/main' && 'max' || 'single' }}

# Read scope for every job, the called browser suite included. The repository
# default is already read-only; stated here it no longer depends on a setting
# outside the repository (W17). The backend job repeats it for itself.
permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/claimant-gate.yml
    with:
      claimant: backend

  backend:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lints the Dockerfile before the test suite, because a finding here is
      # about the file in this pull request and needs no build to appear. It
      # runs here rather than in backend-docker, which has no pull_request
      # trigger: a lint that could only fail after the merge would stop a
      # release instead of stopping a merge.
      #
      # Pinned by version tag, not by digest. Dependabot's docker ecosystem
      # reads the Dockerfiles, not an image named in a workflow's run: line, so
      # a digest here would be a pin nothing moves - the failure mode
      # dependabot.yml's own header describes.
      #
      # The warnings that remain in both Dockerfiles carry inline
      # `hadolint ignore=` pragmas with their reasons, so a clean run means the
      # file matches what was decided, not that nothing was ever found.
      - name: Lint the Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1-alpine < Dockerfile

      # setup-java's own maven cache is the only one. A second actions/cache step
      # on ~/.m2 used to sit below this, described as a fallback for when this
      # cache missed. It could not act as one: both keys hashed pom.xml, so they
      # missed together, and every run restored the same directory twice and
      # saved it twice. It was also half of the repository's Maven cache
      # footprint, competing with the image scanner's database for the 10 GB
      # Actions cache budget.
      #
      # check-latest is deliberately left at its default of false, so the JDK
      # comes from the runner's tool cache and the same commit resolves the
      # same patch release on every run. Turning it on would make the toolchain
      # move without a record in this repository, which is the opposite of how
      # every other version here is handled - npm, pandoc, redocly, the scanner,
      # Tomcat, H2 and every action reference are pinned.
      #
      # It costs nothing in security. This JDK never reaches production: the
      # shipped jar is compiled inside the image by the Dockerfile's
      # maven:3-eclipse-temurin-21 stage and runs on eclipse-temurin:21-jre-alpine,
      # both pulled fresh on every build. The JDK here only runs the test suite.
      #
      # It also has diagnostic value. A fixed resolution line in the log is what
      # let the PR #110 investigation rule out the setup-java major bump as the
      # cause before looking anywhere else.
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # This step deliberately receives no secrets. The test profile supplies
      # everything the suite needs: application-test.yml sets the datasource to
      # H2 and the Google registration to test-client-id/test-client-secret.
      #
      # SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID is the
      # relaxed-binding form of spring.security.oauth2.client.registration
      # .google.client-id, and an environment variable outranks profile YAML, so
      # passing it did not feed the ${...} in application.yml - it overrode the
      # test profile's literal. Every run therefore tested against the real
      # client id rather than the dummy one the file states.
      #
      # It also made the job depend on secrets being present. A Dependabot pull
      # request cannot see repository secrets, so the variable arrived empty,
      # overrode test-client-id with "", and 177 tests failed to load a context
      # (PR #110, 2026-09-11). Granting Dependabot those secrets was the wrong
      # fix: the database is behind an IP allowlist it could never reach, and a
      # dependency bot has no business holding production credentials.
      #
      # DB_URL, DB_USER and DB_PASS were a different shape of the same mistake.
      # They are not Spring property names, so they are only read through
      # ${DB_URL} in the base and prod profiles - neither of which is active
      # here. scripts/start.sh maps them to SPRING_DATASOURCE_URL in the
      # container, which is where they belong.
      #
      # e2e-playwright.yml already proves this: it launches the same jar with
      # --spring.profiles.active=test,e2e and no secrets at all, and the backend
      # reports healthy in about two seconds.
      - name: Build and test
        run: |
          set -euo pipefail
          mvn clean verify -Dspring.profiles.active=test

      - name: Upload JaCoCo coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/site/jacoco/
          retention-days: 30

      # Only on failure, and deliberately so. Surefire writes one XML and one
      # .txt per test class under target/surefire-reports; the .txt carries the
      # exception and stack trace for each failure. On a green run that is two
      # files per test class that nobody reads.
      #
      # On a red run it is the difference between downloading one artifact and
      # searching a 50,000-line log. PR #110 failed with 177 context-load errors
      # from a single root cause, and finding that cause meant paging through
      # the raw log because these files were not kept.
      #
      # if-no-files-found: warn, not error - a compilation failure produces no
      # reports at all, and this step must not turn that into a second, less
      # informative failure.
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/surefire-reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Backend Build & Test"
            echo "- **Coverage artifact:** \`jacoco-html-${{ github.event.pull_request.head.sha || github.sha }}\`"
            echo "- **Next:** \`backend-docker.yml\` builds and scans the Docker image"
          } >> "$GITHUB_STEP_SUMMARY"

  # The suite runs beside the backend job, not after it: it builds its own jar
  # and its own bundle. Skipped when the gate inside it finds nothing to see,
  # and on a pull request frontend-ci also checks (frontend-ci runs it there).
  e2e:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/e2e-playwright.yml
    with:
      caller: backend-ci

  # YAML hygiene and actionlint; skipped unless the pull request changes a
  # checked YAML file (gate inside yaml-lint.yml).
  yaml-lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/yaml-lint.yml

  # The only job branch protection sees. It fails when the gate or any job above
  # failed or was cancelled, and passes when the suite or the lint was skipped,
  # so a red browser suite fails this run and the deploy chain never starts
  # (ADR-0016). With the gate's run=false every job above is skipped and it
  # passes: the pull request is not the backend's (ADR-0019).
  build-and-test:
    name: build-and-test-backend
    needs: [changes, backend, e2e, yaml-lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the backend job, the browser suite and the YAML lint
        run: |
          set -eu
          echo "gate=${{ needs.changes.result }}/${{ needs.changes.outputs.run }} backend=${{ needs.backend.result }} e2e=${{ needs.e2e.result }} yaml-lint=${{ needs.yaml-lint.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          [ "${{ needs.changes.outputs.run }}" = "false" ] && exit 0
          [ "${{ needs.backend.result }}" = "success" ] || exit 1
          for r in "${{ needs.e2e.result }}" "${{ needs.yaml-lint.result }}"; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
