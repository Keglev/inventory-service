# =============================================================================
# Smart Supply Pro – Frontend E2E (Playwright)
#
# Contract (ADR-0009, frontend): run the browser suite against a LOCAL stack
# built from this commit. Backend = packaged jar on H2 in the `test,e2e`
# profile (seeded, demo reads on). Frontend = production bundle served by
# `vite preview` on 5173, the origin the backend's default CORS list admits.
# Nothing here touches Hetzner, Oracle, Koyeb or any secret.
#
# Job name is `e2e`, deliberately NOT `build-and-test`: this check is advisory
# until ten consecutive green PR runs; branch protection only requires
# `build-and-test`. Renaming the job to the required name would make it a gate.
#
# H2 is test-scoped and absent from the jar, so the backend is launched with
# the H2 driver on the parent classpath via Boot's JarLauncher (see the header
# of src/main/resources/application-e2e.yml). The version is the pom's H2 pin.
# =============================================================================
name: 7 Frontend E2E - Playwright

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/7-frontend-e2e.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/7-frontend-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a newer push supersedes the previous one (nothing is deployed here)
concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  H2_VERSION: 2.3.232
  BACKEND_URL: http://localhost:8081
  # Same pin as 5-frontend-ci.yml. Without it this job took whatever npm the
  # Node 24 image happened to ship, which is why the two jobs printed different
  # install warnings for the same lockfile on 2026-09-03.
  NPM_VERSION: '11.10.1'

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tests are the job of 1-ci-test; this job only needs a runnable jar
      - name: Package backend (no tests)
        run: mvn -q -B -Dmaven.test.skip=true package

      - name: Resolve H2 driver into the local repository
        run: mvn -q -B dependency:get -Dartifact=com.h2database:h2:${H2_VERSION}

      - name: Start backend (test,e2e profile)
        run: |
          JAR=$(ls target/inventory-service-*.jar | grep -v original | head -n 1)
          H2=$HOME/.m2/repository/com/h2database/h2/${H2_VERSION}/h2-${H2_VERSION}.jar
          test -f "$H2" || { echo "H2 driver missing at $H2"; exit 1; }
          nohup java -cp "$JAR:$H2" org.springframework.boot.loader.launch.JarLauncher \
            --spring.profiles.active=test,e2e > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # npm version drift causes lockfile metadata churn; pin to keep CI deterministic
      - name: Pin npm version
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          echo "npm: $(npm --version)"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The API origin is baked into the bundle at build time (VITE_API_BASE)
      - name: Build frontend against the local backend
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ env.BACKEND_URL }}
        run: npm run build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf "${BACKEND_URL}/actuator/health" | grep -q '"UP"'; then
              echo "backend healthy after $((i*2))s"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy"; tail -n 80 "$RUNNER_TEMP/backend.log"; exit 1

      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Stop backend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backend.pid" ]; then kill "$(cat "$RUNNER_TEMP/backend.pid")" || true; fi

      - name: Upload Playwright report and backend log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/backend.log
          retention-days: 7
