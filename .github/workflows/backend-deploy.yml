# =============================================================================
# Smart Supply Pro – Backend Release to Hetzner
#
# Runs after backend-docker.yml has pushed and scanned the image for a commit
# on main. Copies the compose file from that commit to the host, validates it,
# then pulls and restarts only the backend service. The compose file in the
# repository is the source of truth; the host holds a copy plus .env.prod.
#
# The deploy user owns /opt/smartsupplypro and nothing else on the host, so
# the compose file is the only thing this job ever writes there. .env.prod is
# hand-managed on the host and never touched by CI.
#
# The deploy key is written from a secret through the environment, never
# interpolated into a command line, and no step in this job uses set -x.
# Host key: trust on first use, same reasoning as the sibling project.
# =============================================================================
name: Backend Deploy - Hetzner

on:
  workflow_run:
    workflows: ["Backend Docker - Build & Scan"]
    types: [completed]
    branches: [ "main" ]
  workflow_dispatch:

# One release at a time, in order. Each run releases its own commit's image and
# skips a commit with no image-relevant change, so a dropped pending run could
# leave a built image unreleased when the run that replaced it skips (CI-1).
# queue: max keeps every pending run; without it GitHub keeps one.
concurrency:
  group: backend-deploy
  cancel-in-progress: false
  queue: max

# The login name is configuration, not a credential; the SSH key is the
# credential and stays a secret. Holding it as a secret bought nothing and cost
# readability: GitHub masks every occurrence of a secret's value anywhere in a
# run, and this value is an ordinary English word, so the workflow name, the job
# name and any path containing it all rendered as ***. Deploy runs were hard to
# identify in the Actions list.
env:
  DEPLOY_USER: deploy

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      HEALTH_URL: https://api.smartsupplypro.de

    steps:
      # The commit to release is the one backend-docker built, handed over as an
      # artifact with that run's image gate verdict; this run's own head_sha and
      # the triggering run's head_sha are main's HEAD at creation time and can
      # name a later, unbuilt merge (CI-2). The gate itself lives in
      # backend-docker only (W2): a commit without an image has nothing to
      # release, and a second copy of the path list could drift from the first.
      - name: Fetch the commit and the verdict backend-docker recorded
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-commit
          path: built-commit
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Outcomes: a full commit hash -> IMAGE_TAG_SHA for every later step, and
      # build=true releases it; build=false (backend-docker built no image)
      # releases nothing and the run ends green. A missing artifact fails the
      # step above; a value that is not a 40-hex hash or not true/false fails
      # here, before the host is touched. A manual run releases the dispatched
      # commit.
      - name: Resolve the commit to release
        id: gate
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha="$GITHUB_SHA"; build=true
          else
            sha=$(cat built-commit/built-commit.txt)
            # Only a backend-docker run older than W2 hands over no verdict.
            [ -f built-commit/build.txt ] || { echo "::error::no build.txt: backend-docker ran an older workflow file; dispatch backend-deploy"; exit 1; }
            build=$(cat built-commit/build.txt)
          fi
          if ! grep -qE '^[0-9a-f]{40}$' <<< "$sha"; then
            echo "::error::backend-docker handed over '$sha', not a commit hash"; exit 1
          fi
          case "$build" in
            true) ;;
            false) echo "No image-relevant change in $sha; nothing to release." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::backend-docker handed over build='$build', not true or false"; exit 1 ;;
          esac
          echo "IMAGE_TAG_SHA=$sha" >> "$GITHUB_ENV"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.gate.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.IMAGE_TAG_SHA }}

      - name: Install the deploy key
        if: steps.gate.outputs.build == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      # The deploy user owns /opt/smartsupplypro and nothing else on the host, so
      # the compose file is the only thing this job ever writes there; .env.prod
      # is hand-managed on the host and never touched by CI.
      - name: Ship the compose file
        if: steps.gate.outputs.build == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -eu
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            docker/docker-compose.prod.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/smartsupplypro/docker-compose.prod.yml"

      # Pinning the SHA tag rather than :latest makes the deployed image the one
      # this run scanned, and gives a rollback a concrete tag to return to.
      - name: Validate, pull and restart the backend service
        if: steps.gate.outputs.build == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -eu
             cd /opt/smartsupplypro
             export BACKEND_IMAGE=ghcr.io/keglev/inventory-service/backend:${IMAGE_TAG_SHA}
             docker compose -f docker-compose.prod.yml --env-file .env.prod config -q
             docker compose -f docker-compose.prod.yml --env-file .env.prod pull backend
             docker compose -f docker-compose.prod.yml --env-file .env.prod up -d backend
             docker image prune -f >/dev/null"

      - name: Health check and smoke tests
        if: steps.gate.outputs.build == 'true'
        run: bash .github/scripts/health-check.sh "${{ env.HEALTH_URL }}"

      # A green deploy says the release was accepted, not that it is running.
      # This asserts the jar answering requests reports the commit just
      # released. It runs after the health gate on purpose: compose recreates
      # the container, so the service is down rather than serving the previous
      # release, and health-check.sh is what waits for it to come back. The
      # frontend orders these the other way round for the opposite reason.
      - name: Verify the running jar is the released commit
        if: steps.gate.outputs.build == 'true'
        run: bash .github/scripts/verify-backend-build.sh "${{ env.HEALTH_URL }}" "${{ env.IMAGE_TAG_SHA }}"

      - name: Job summary
        if: always() && steps.gate.outputs.build == 'true'
        run: |
          {
            echo "## Backend Release"
            echo "- **Image:** \`ghcr.io/keglev/inventory-service/backend:${{ env.IMAGE_TAG_SHA }}\`"
            echo "- **Host:** api.smartsupplypro.de"
          } >> "$GITHUB_STEP_SUMMARY"
