# =============================================================================
# backend-deploy.yml - releases the backend image to the Hetzner host
# Usage: runs after backend-docker.yml succeeds for a commit on main
#        (workflow_run), or by hand (workflow_dispatch releases the dispatched
#        commit's image).
# Produces: the commit's compose file copied to /opt/smartsupplypro, validated,
#        and only the backend service pulled and restarted on the image tagged
#        with the full commit hash; then the health check and the build-commit
#        check against api.smartsupplypro.de. The repository's compose file is
#        the source of truth; .env.prod is hand-managed on the host.
#        The deploy key reaches the runner through the environment, never a
#        command line, and no step uses set -x. Host key: trust on first use,
#        as in the sibling project.
# Failure mode: a missing or malformed handover fails before the host is
#        touched; a failed copy, compose validation or pull fails the job with
#        the previous release still running; a failed health or commit check
#        fails the run after the restart.
# =============================================================================
name: Backend Deploy - Hetzner

on:
  workflow_run:
    workflows: ["Backend Docker - Build & Scan"]
    types: [completed]
    branches: [ "main" ]
  workflow_dispatch:

# One release at a time, in order: a dropped pending run could leave a built image
# unreleased when the run that replaced it skips. queue: max keeps every pending
# run; without it GitHub keeps one.
concurrency:
  group: backend-deploy
  cancel-in-progress: false
  queue: max

# The login name is configuration, not a credential (the SSH key is). As a secret,
# an ordinary word, GitHub would mask it everywhere in a run, and run names and
# paths would render as ***.
env:
  DEPLOY_USER: deploy

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      HEALTH_URL: https://api.smartsupplypro.de

    steps:
      # The commit to release is the one backend-docker built, handed over with its
      # gate verdict: both runs' head_sha are main's HEAD at creation and can name a
      # later, unbuilt merge. One gate only: a second path list could drift.
      - name: Fetch the commit and the verdict backend-docker recorded
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-commit
          path: built-commit
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      #   PASSES with a 40-hex hash (IMAGE_TAG_SHA) and build=true: release it;
      #     a manual run releases the dispatched commit.
      #   SKIPS with build=false (no image built): nothing released, run green.
      #   FAILS on a missing artifact (step above), another value or a missing
      #     build.txt, before the host is touched.
      - name: Resolve the commit to release
        id: gate
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha="$GITHUB_SHA"; build=true
          else
            sha=$(cat built-commit/built-commit.txt)
            # Only a re-run of a backend-docker run older than build.txt lacks it.
            [ -f built-commit/build.txt ] || { echo "::error::no build.txt: backend-docker ran an older workflow file; dispatch backend-deploy"; exit 1; }
            build=$(cat built-commit/build.txt)
          fi
          if ! grep -qE '^[0-9a-f]{40}$' <<< "$sha"; then
            echo "::error::backend-docker handed over '$sha', not a commit hash"; exit 1
          fi
          case "$build" in
            true) ;;
            false) echo "No image-relevant change in $sha; nothing to release." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::backend-docker handed over build='$build', not true or false"; exit 1 ;;
          esac
          echo "IMAGE_TAG_SHA=$sha" >> "$GITHUB_ENV"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.gate.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.IMAGE_TAG_SHA }}

      - name: Install the deploy key
        if: steps.gate.outputs.build == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      # The deploy user owns /opt/smartsupplypro and nothing else on the host, so
      # this file is the only thing the job writes there; CI never touches .env.prod.
      - name: Ship the compose file
        if: steps.gate.outputs.build == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -eu
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            docker/docker-compose.prod.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/smartsupplypro/docker-compose.prod.yml"

      # Pinning the SHA tag rather than :latest makes the deployed image the one
      # this run scanned, and gives a rollback a concrete tag to return to.
      - name: Validate, pull and restart the backend service
        if: steps.gate.outputs.build == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -eu
             cd /opt/smartsupplypro
             export BACKEND_IMAGE=ghcr.io/keglev/inventory-service/backend:${IMAGE_TAG_SHA}
             docker compose -f docker-compose.prod.yml --env-file .env.prod config -q
             docker compose -f docker-compose.prod.yml --env-file .env.prod pull backend
             docker compose -f docker-compose.prod.yml --env-file .env.prod up -d backend
             docker image prune -f >/dev/null"

      - name: Health check and smoke tests
        if: steps.gate.outputs.build == 'true'
        run: bash .github/scripts/health-check.sh "${{ env.HEALTH_URL }}"

      # A green deploy means accepted, not running: the answering jar must report the
      # released commit. After the health gate, because compose recreates the
      # container (down, not serving the old one); the frontend orders it the other way.
      - name: Verify the running jar is the released commit
        if: steps.gate.outputs.build == 'true'
        run: bash .github/scripts/verify-backend-build.sh "${{ env.HEALTH_URL }}" "${{ env.IMAGE_TAG_SHA }}"

      - name: Job summary
        if: always() && steps.gate.outputs.build == 'true'
        run: |
          {
            echo "## Backend Release"
            echo "- **Image:** \`ghcr.io/keglev/inventory-service/backend:${{ env.IMAGE_TAG_SHA }}\`"
            echo "- **Host:** api.smartsupplypro.de"
          } >> "$GITHUB_STEP_SUMMARY"
