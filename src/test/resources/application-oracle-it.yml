# =============================================================================
# application-oracle-it.yml - local smoke test against the real Oracle database
# A manual run from a developer machine against the Oracle Autonomous Database
# (Free Tier); never in CI. Needs the wallet extracted locally, DB_URL, DB_USER
# and DB_PASS set, and the machine's public IP on Oracle's allow-list.
# Usage: mvn test -Dtest=InventoryServiceApplicationTest -DenableWalletTest=true
#        (docs/backend/architecture/oracle-it-smoke-test.md); the profile is
#        inactive without that flag.
# Produces: a two-connection Oracle pool, no schema changes (ddl-auto none) and
#        the SQL Hibernate sends, logged at DEBUG.
# Failure mode: a missing wallet, unset DB variables or a blocked IP fail the
#        context load, so the one test reports the connection error.
# =============================================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      # Keep pool small; Oracle Free Tier can be sensitive to idle timeouts.
      maximum-pool-size: 2
      minimum-idle: 0
      connection-test-query: SELECT 1 FROM DUAL

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

  sql:
    init:
      mode: never

logging:
  level:
    # The SQL log, once: show-sql would print every statement a second time to stdout
    '[org.hibernate.SQL]': DEBUG
    root: INFO
