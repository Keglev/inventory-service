# =============================================================================
# application-test.yml - the in-memory profile the backend tests run on
# Usage: @ActiveProfiles("test") on the test classes and
#        -Dspring.profiles.active=test in the build; the e2e profile runs on
#        top of it (test,e2e).
# Produces: H2 in Oracle mode with create-drop, a stubbed Google client, no
#        Flyway, demo read-only off, and actuator health (with details) and
#        info (with build info) as the CI assertions read them.
# Failure mode: a query H2 cannot run in Oracle mode fails the tests that reach
#        it, not the start. The Oracle-only SQL builders are chosen by profile
#        name (DatabaseDialectDetector), so this profile must stay active
#        wherever H2 is the database.
# =============================================================================

spring:
  datasource:
    # Oracle-compat mode + keep DB alive for the test JVM
    url: jdbc:h2:mem:ssp;MODE=Oracle;DATABASE_TO_UPPER=true;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # OAuth2 configuration for tests (dummy values)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: openid,profile,email
            # Endpoints + redirect-uri come from Spring's CommonOAuth2Provider.GOOGLE

  flyway:
    enabled: false                # Tests use H2 create-drop; migrations are Oracle-specific

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        '[format_sql]': true                   # Format SQL for easier reading in logs
        '[jdbc.time_zone]': UTC                # Ensure consistent timezone handling
  sql:
    init:
      mode: never

# Test logging lives only in src/test/resources/logback-test.xml. To see a test's
# SQL, add -Dlogging.level.org.hibernate.SQL=DEBUG to the Maven command (it reaches
# the forked JVM); show-sql on top would print every statement twice.

management:
  endpoints:
    web:
      exposure:
        include: health,info       # info mirrors prod so the build-info wiring is under test
  endpoint:
    health:
      show-details: always         # Always show detailed health info (for CI assertions)
  info:
    build:
      enabled: true                # Contribute build-info.properties to /actuator/info

app:
  demo-readonly: false
  frontend:
    # No frontend needed: redirect to backend /api/me after Google login
    base-url: http://localhost:8081
    landing-path: /api/me
