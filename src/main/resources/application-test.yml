# ============================================
# Spring Boot - Test Environment Config
# Profile: test
# Used for unit, integration, and CI testing
# ============================================

spring:
  datasource:
    # Oracle-compat mode + keep DB alive for the test JVM
    url: jdbc:h2:mem:ssp;MODE=Oracle;DATABASE_TO_UPPER=true;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE     
    driver-class-name: org.h2.Driver
    username: sa                    # Default username
    password:                       # No password required for in-memory use

  # OAuth2 configuration for tests (dummy values)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: openid,profile,email
            # Endpoints + redirect-uri come from Spring's CommonOAuth2Provider.GOOGLE

  flyway:
    enabled: false                # Tests use H2 create-drop; migrations are Oracle-specific

  jpa:
    hibernate:
      ddl-auto: create-drop       # Create schema on startup, drop it on shutdown
    properties:
      hibernate:
        '[format_sql]': true                   # Format SQL for easier reading in logs
        '[globally_quoted_identifiers]': false # keep "CHANGE" / "TIMESTAMP" quoted
        '[jdbc.time_zone]': UTC                # Ensure consistent timezone handling
  sql:
    init:
      mode: never

  h2:
    console:
      enabled: true               # Enable browser-based H2 console for debugging
      path: /h2-console           # Accessible at /h2-console (only in local/test environments)

# Logging for tests lives in src/test/resources/logback-test.xml and nowhere
# else. This profile used to set a root level and two Hibernate levels here,
# which silently overrode that file and defeated its stated purpose. One of the
# two levels never worked at all: Hibernate 6 renamed the parameter-binding
# logger, so it logged nothing while claiming to log parameter values.
#
# To see the statements a test executes, add this to the Maven command:
#   -Dlogging.level.org.hibernate.SQL=DEBUG
# Verified to reach the forked test JVM. Do not also switch the statement echo
# back on: the two are separate channels for the same output and enabling both
# prints every statement twice, which is what this profile used to do.

server:
  port: 8081                       # Ensure consistent port for testing environments

management:
  endpoints:
    web:
      exposure:
        include: health,info       # info mirrors prod so the build-info wiring is under test
  endpoint:
    health:
      show-details: always         # Always show detailed health info (for CI assertions)
  info:
    build:
      enabled: true                # Contribute build-info.properties to /actuator/info

# -------- App-level (test) --------
app:
  demo-readonly: false
  frontend:
    # No frontend needed: redirect to backend /api/me after Google login
    base-url: http://localhost:8081
    landing-path: /api/me

# Overrides schema for H2 tests (used in @Table(schema = "$(USERS_SCHEMA:ADMIN)")) 