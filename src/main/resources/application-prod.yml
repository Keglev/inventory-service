# =============================================================================
# application-prod.yml - what production sets differently from application.yml
# Usage: active in the backend container: scripts/start.sh defaults
#        SPRING_PROFILES_ACTIVE to prod.
# Produces: a Hikari pool sized for one small container against Oracle, Flyway
#        migrations from db/migration with Hibernate validating the schema,
#        actuator health and info, and the production CORS origin and frontend
#        URL. The datasource, OAuth2 client, server port and cookies, demo flag
#        and landing path come from application.yml unchanged.
# Failure mode: a failed migration, or a schema that does not match the
#        entities (ddl-auto validate), stops the start; so does a missing
#        ORACLE_WALLET_PASSWORD, an unresolvable placeholder.
# =============================================================================

# Note: avoid hardcoding secrets here; use environment variables or secret management

spring:
  datasource:
    hikari:
      # Oracle Autonomous Database has aggressive idle timeouts (~5 min)
      # These settings prevent "ORA-17008: Closed connection" errors
      connection-timeout: 30000                # 30 seconds to establish connection
      validation-timeout: 5000                 # 5 seconds to validate connection
      maximum-pool-size: 5                     # Keep pool small; container is capped at 1400 MiB
      minimum-idle: 2                          # Maintain at least 2 idle connections
      max-lifetime: 240000                     # 4 minutes (less than Oracle's 5-min timeout)
      idle-timeout: 180000                     # 3 minutes idle before eviction
      connection-test-query: SELECT 1 FROM DUAL # Oracle-specific health check
      leak-detection-threshold: 60000          # 60 seconds - detect connection leaks
      keepalive-time: 120000                   # 2 minutes - keepalive ping
      # The wallet password goes to the Oracle driver as a connection property
      # read from the environment, never as a -D argument, which any user on
      # the shared host could read with ps (FW6 S1, ADR-0009 amendment). The
      # brackets keep the dots in the key.
      data-source-properties:
        "[oracle.net.wallet_password]": ${ORACLE_WALLET_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true                  # Adopt the existing (pre-Flyway) schema as baseline
    baseline-version: 1                        # Existing schema = V1; first real migration is V2
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate                       # Schema is owned by Flyway; Hibernate only validates mappings
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

# Health details stay hidden (Boot's default, never) and log levels stay at
# Boot's default (INFO).
management:
  endpoints:
    web:
      exposure:
        # health and info only. info carries build-info.properties: artifact,
        # version, build time, and the commit the jar was built from. The deploy
        # asserts against it. None of that is secret on a public repository, and
        # the frontend bundle already ships the same commit.
        include: health,info

# -------- App-level (prod) --------
app:
  cors:
    allowed-origins:
      # Canonical public origin. The platform-generated Koyeb hostname still serves the
      # SPA but is no longer a supported entry point and is deliberately not allow-listed.
      - https://www.smartsupplypro.de

  frontend:
    # Canonical public domain; drives every post-login and error redirect.
    base-url: ${APP_FRONTEND_BASE_URL:https://www.smartsupplypro.de}
