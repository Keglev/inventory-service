# =============================================================================
# application.yml - the settings every profile starts from
# Usage: Spring Boot loads it on every start; a profile file (prod, test, e2e,
#        oracle-it) overrides only the keys it names.
# Produces: the Oracle datasource and the Google OAuth2 client from environment
#        variables, port 8081 behind the proxy (forwarded headers trusted), the
#        session cookie flags, and the app.* settings AppProperties binds: demo
#        read-only, admin emails, CORS origins and the frontend URLs.
# Failure mode: with no profile, a missing DB_URL, DB_USER, DB_PASS or OAuth2
#        client variable stops the start, because Spring cannot resolve the
#        placeholder. Flyway stays off here, so this file never migrates a
#        schema on its own.
# =============================================================================

spring:
  application:
    name: Inventory Service

  profiles:
    # No default profile: start.sh sets prod in the container, the build and
    # the tests set test (and e2e) themselves.
    active:

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: oracle.jdbc.OracleDriver

  data:
    web:
      pageable:
        # Pages are written as Spring Data's PagedModel,
        # {"content":[...],"page":{"size","number","totalElements","totalPages"}},
        # the stable shape Spring Data recommends over serialising PageImpl as-is.
        serialization-mode: via-dto

  flyway:
    enabled: false                              # Migrations run only where explicitly enabled (prod profile)

  security:
    oauth2:
      client:
        registration:
          google:
            # The environment variable outranks every profile YAML (relaxed binding),
            # even when set empty, so set it (and the client-secret one) only in
            # .env.prod: wherever it is set, application-test.yml's values never apply.
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            # Endpoints + redirect-uri come from Spring's CommonOAuth2Provider.GOOGLE

  jpa:
    hibernate:
      ddl-auto: none
    # A REST API: responses are DTOs built inside the service transaction and no
    # view renders, so an open EntityManager per request would only hide a lazy
    # read outside a transaction.
    open-in-view: false

server:
  port: 8081
  address: 0.0.0.0
  # TLS ends at the host's Caddy (backend ADR-0012): trust its X-Forwarded-*
  # headers so redirects, the OAuth2 redirect URI included, carry https and the
  # public host.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # Lax: frontend and API share the registrable domain and the OAuth2 return is
        # a top-level navigation (backend ADR-0012, backend ADR-0007 currency note).
        same-site: lax
        secure: true

# SQL logging stays off here and a profile opts in: a default that every profile
# has to cancel in several keys ends up cancelled in only some of them.

# app.* binds to AppProperties.
app:
  # Default ON: anonymous callers get the read-only demo. APP_DEMO_READONLY=false
  # turns it off.
  demo-readonly: ${APP_DEMO_READONLY:true}

  # Sign-in allow-list and admin role (comma-separated, case-insensitive).
  # Empty means nobody can sign in. Example: APP_ADMIN_EMAILS="me@example.com, ops@example.org"
  admin-emails: ${APP_ADMIN_EMAILS:}

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://localhost:5173


  frontend:
    # Default: the Vite dev server.
    base-url: ${APP_FRONTEND_BASE_URL:https://localhost:5173}
    landing-path: /auth  # After login, redirect here (frontend route)
