openapi: 3.0.3
info:
  title: Smart Supply Pro – Backend API
  version: 2.0.0
  description: |
    Enterprise REST API for Smart Supply Pro inventory and supplier management system.
    
    ## Features
    - OAuth2 authentication with Google
    - Inventory item management with audit trail
    - Supplier relationship management
    - Stock movement tracking and analytics
    - Dashboard KPIs
    
    ## Authentication
    Sign-in uses Google OAuth2 with the authorization-code flow, run by the
    backend (start: `/oauth2/authorization/google`); only e-mail addresses on the
    sign-in allow-list are admitted. After sign-in the backend keeps a server
    session, and the browser sends its session cookie (`JSESSIONID`, HttpOnly,
    Secure, SameSite=Lax) with every request. No bearer token is accepted.

    Roles: **USER** reads everything except the employee analytics (403) and may
    adjust quantity and price; **ADMIN** may also create, rename and delete items
    and manage suppliers.

    ## Demo mode
    With demo mode on (`app.demo-readonly`, the production default), every GET
    under `/api/inventory`, `/api/analytics` and `/api/suppliers` also answers
    anonymous callers; those operations list `{}` among their security
    requirements, and identities in their responses are masked. Writes always
    need a signed-in user: an anonymous write answers 401.

  contact:
    name: Smart Supply Pro Team
    url: https://github.com/Keglev/inventory-service

