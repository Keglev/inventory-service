components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        Sign-in with Google, authorization-code flow, run by the backend.

        **Flow:**
        1. The browser opens `/oauth2/authorization/google`.
        2. The backend redirects to Google; the user grants openid, profile, email.
        3. Google redirects back to `/login/oauth2/code/google` with a code.
        4. The backend exchanges the code, checks the e-mail against the
           sign-in allow-list and opens a server session.
        5. Later requests carry the session cookie (`JSESSIONID`); no token ever
           reaches the browser.
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            openid: OpenID Connect standard claims
            profile: User profile information (name, picture, etc.)
            email: User email address
