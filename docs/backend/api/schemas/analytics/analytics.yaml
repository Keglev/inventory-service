components:
  schemas:
    StockValueOverTimeDTO:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Day of the change point (the value holds until the next point)
          example: "2025-11-15"
        totalValue:
          type: number
          format: double
          description: Closing inventory value on this date (quantity times last known unit price, summed over items)
          example: 45000.00
      description: Time series data point for stock value tracking

    StockPerSupplierDTO:
      type: object
      required:
        - supplierName
        - totalQuantity
        - totalValue
      properties:
        supplierName:
          type: string
          description: Supplier display name
          example: "Acme Corp"
        totalQuantity:
          type: integer
          format: int64
          description: Units in stock from this supplier's active items
          example: 1500
        totalValue:
          type: number
          format: double
          description: Those units at each item's current unit price
          example: 45000.00
      description: Stock distribution metrics per supplier

    LowStockItemDTO:
      type: object
      required: [itemName, quantity, minimumQuantity]
      properties:
        itemName:
          type: string
          description: Item display name
          example: "Deep Groove Ball Bearing 6204-2RS"
        quantity:
          type: integer
          format: int32
          description: Current stock quantity
          example: 15
        minimumQuantity:
          type: integer
          format: int32
          description: The item's minimum; the item is listed while quantity is below it
          example: 25
      description: An item of the requested supplier whose stock is below its minimum

    ItemUpdateFrequencyDTO:
      type: object
      required: [itemName, updateCount]
      properties:
        itemName:
          type: string
          description: Item display name
          example: "Deep Groove Ball Bearing 6204-2RS"
        updateCount:
          type: integer
          format: int64
          description: Number of stock changes recorded for the item
          example: 14
      description: How often an item's stock changed

    MonthlyStockMovementDTO:
      type: object
      required: [month, stockIn, stockOut]
      properties:
        month:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}$'
          description: Calendar month, YYYY-MM
          example: "2026-10"
        stockIn:
          type: integer
          format: int64
          description: Units received or restocked in the month
          example: 99
        stockOut:
          type: integer
          format: int64
          description: Units sold or written off in the month (a positive number)
          example: 8
      description: Inbound and outbound units for one calendar month

    ReasonBreakdownDTO:
      type: object
      required: [reason, increase, decrease]
      properties:
        reason:
          type: string
          description: StockChangeReason enum name
          example: "SOLD"
        increase:
          type: integer
          format: int64
          description: Total units added under this reason (sum of positive changes)
        decrease:
          type: integer
          format: int64
          description: Total units removed under this reason (absolute sum of negative changes)

    EmployeeActivityDTO:
      type: object
      required: [period, createdBy, displayName, changeCount]
      properties:
        period:
          type: string
          description: Time bucket label per the granularity parameter
        createdBy:
          type: string
          description: Audit identity (email) recorded on the stock history rows
        displayName:
          type: string
          description: Human-readable name for charts and tables
        changeCount:
          type: integer
          format: int64
          description: Number of stock changes in the bucket

    StockUpdateResultDTO:
      type: object
      required: [itemName, supplierName, change, reason, createdBy, timestamp]
      properties:
        itemName:
          type: string
          description: Display name of the affected item
          example: "Holzpellets 06 mm Sackware 15kg"
        supplierName:
          type: string
          description: Display name of the item's supplier
          example: "Obi markt"
        change:
          type: integer
          format: int32
          description: Signed quantity delta (positive inbound, negative outbound; 0 for a price change)
          example: -3
        reason:
          type: string
          description: Stock change reason code
          example: "SOLD"
        createdBy:
          type: string
          description: E-mail of the user who made the change; masked for anonymous demo callers
          example: "demo-user-2@example.com"
        timestamp:
          type: string
          description: Server-local date-time of the change, ISO-8601 without an offset
          example: "2026-10-28T19:40:02.730095"
      description: One stock change, with item and supplier resolved to display names

    PriceTrendDTO:
      type: object
      required: [timestamp, price]
      properties:
        timestamp:
          type: string
          format: date
          description: Day of the price point (yyyy-MM-dd; day granularity on every database)
          example: "2026-09-01"
        price:
          type: number
          description: Unit price on that day
          example: 4.1
      description: One point of an item's price history

    DashboardSummaryDTO:
      type: object
      properties:
        stockPerSupplier:
          type: array
          items:
            $ref: '#/components/schemas/StockPerSupplierDTO'
          description: Stock distribution across suppliers
        lowStockItems:
          type: array
          items:
            $ref: '#/components/schemas/LowStockItemDTO'
          description: Items below their minimum quantity; every one when no supplier is given, the three lowest for a supplier
        monthlyStockMovement:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyStockMovementDTO'
          description: Monthly inventory flow trends
        topUpdatedItems:
          type: array
          items:
            $ref: '#/components/schemas/ItemUpdateFrequencyDTO'
          description: Most frequently updated items
      description: |
        The dashboard's aggregates in one response.

    FinancialSummaryDTO:
      type: object
      required: [method, fromDate, toDate, openingQty, openingValue, purchasesQty, purchasesCost,
                 returnsInQty, returnsInCost, cogsQty, cogsCost, writeOffQty, writeOffCost,
                 endingQty, endingValue]
      properties:
        method:
          type: string
          enum: [WAC]
          description: Costing method; always Weighted Average Cost
          example: WAC
        fromDate:
          type: string
          format: date
          description: Period start (inclusive)
          example: "2026-09-01"
        toDate:
          type: string
          format: date
          description: Period end (inclusive)
          example: "2026-10-31"
        openingQty:
          type: integer
          format: int64
          description: Units on hand at the start of the period
          example: 318
        openingValue:
          type: number
          description: Value of the opening stock at WAC
          example: 1789.95
        purchasesQty:
          type: integer
          format: int64
          description: Units received (inbound with a price, or INITIAL_STOCK), net of RETURNED_TO_SUPPLIER
          example: 6
        purchasesCost:
          type: number
          description: Cost of the units received
          example: 59.4
        returnsInQty:
          type: integer
          format: int64
          description: Units returned by customers (RETURNED_BY_CUSTOMER)
          example: 0
        returnsInCost:
          type: number
          description: Value of the customer returns
          example: 0
        cogsQty:
          type: integer
          format: int64
          description: Units sold (cost of goods sold)
          example: 7
        cogsCost:
          type: number
          description: Cost of the units sold at WAC
          example: 69.3
        writeOffQty:
          type: integer
          format: int64
          description: Units written off (scrapped, destroyed, damaged, expired, lost)
          example: 0
        writeOffCost:
          type: number
          description: Value written off at WAC
          example: 0
        endingQty:
          type: integer
          format: int64
          description: Units on hand at the end of the period
          example: 317
        endingValue:
          type: number
          description: Value of the closing stock at WAC
          example: 1780.05
      description: Stock movements and values for one period, costed by Weighted Average Cost (WAC).
