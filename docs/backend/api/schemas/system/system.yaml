HealthDbResponse:
  type: object
  title: Database Health Response
  description: Response from successful database health check
  required:
    - status
  properties:
    status:
      type: string
      enum: [UP]
      description: Health status indicator - "UP" when database is healthy
      example: "UP"
    oracleSeesIp:
      type: string
      description: >-
        Client IP address as seen by the Oracle database using SYS_CONTEXT.
        Present only when the caller is authenticated with the ADMIN role.
      example: "192.168.1.100"

HealthDbError:
  type: object
  title: Database Health Error Response
  description: >-
    Response from failed database health check. The body is fixed; the cause of
    the failure is written to the server log only.
  required:
    - status
  properties:
    status:
      type: string
      enum: [DOWN]
      description: Health status indicator - "DOWN" when database is unavailable
      example: "DOWN"
