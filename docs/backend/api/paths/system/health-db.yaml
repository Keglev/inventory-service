get:
  tags:
    - System
  summary: Deep Database Health Check
  description: |
    Opens a fresh connection and runs an Oracle-specific `SYS_CONTEXT` query.
    Returns 200 when the query succeeds and 503 when the database is unreachable,
    paused (common in Oracle Free Tier) or misconfigured.

    **Security:** publicly accessible (no authentication required), because it is
    the troubleshooting aid for the moments when login is impossible: login stores
    the user in this same database. Anonymous callers and non-admin users receive
    `status` only. An authenticated ADMIN also receives `oracleSeesIp`, the address
    the database sees for this service. A failure never reveals its cause; the
    exception is written to the server log.
  operationId: checkDatabaseConnection
  security: []
  responses:
    '200':
      description: Database is healthy and accessible
      content:
        application/json:
          schema:
            $ref: '../../schemas/system/system.yaml#/HealthDbResponse'
    '503':
      description: Database is unavailable or unreachable
      content:
        application/json:
          schema:
            $ref: '../../schemas/system/system.yaml#/HealthDbError'
    '500':
      $ref: '../../responses/errors.yaml#/components/responses/InternalServerError'
