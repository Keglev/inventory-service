put:
  tags:
    - Suppliers
  summary: Update supplier
  description: |
    Updates an existing supplier completely (full replacement).
    Requires ADMIN role.
    
    **ID Handling:**
    - A body id, if present, must equal the path id; otherwise 400
      ("Path id and body id must match")
    
    **Validation:**
    - All required fields must be provided
    - Email (if provided) must be valid format
  operationId: updateSupplier
  security:
    - oauth2: [openid]
  parameters:
    - $ref: '../../parameters/ids.yaml#/components/parameters/id'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/suppliers/supplier.yaml#/components/schemas/UpdateSupplierRequest'
        example:
          name: "Updated Supplier Corp"
          contactName: "Bob Wilson"
          phone: "+1-555-0201"
          email: "newemail@supplier.com"
  responses:
    '200':
      description: Supplier updated successfully
      content:
        application/json:
          schema:
            $ref: '../../schemas/suppliers/supplier.yaml#/components/schemas/SupplierDTO'
    '400':
      $ref: '../../responses/errors.yaml#/components/responses/ValidationError'
    '401':
      $ref: '../../responses/errors.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../../responses/errors.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../../responses/errors.yaml#/components/responses/NotFound'
    '409':
      description: Another supplier already has this name
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/common.yaml#/components/schemas/ErrorResponse'
          example:
            error: conflict
            message: Supplier already exists
            timestamp: '2026-11-05T10:30:00Z'
            fieldErrors:
              name: Supplier already exists
    '500':
      $ref: '../../responses/errors.yaml#/components/responses/InternalServerError'
