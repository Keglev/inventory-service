delete:
  tags:
    - Suppliers
  summary: Delete supplier
  description: |
    Deletes the supplier row (a hard delete). Requires ADMIN role.

    **Business rule:** fails with 409 while any item of this supplier still has
    stock (quantity > 0).
  operationId: deleteSupplier
  security:
    - oauth2: [openid]
  parameters:
    - $ref: '../../parameters/ids.yaml#/components/parameters/id'
  responses:
    '204':
      description: Supplier deleted successfully (no content)
    '401':
      $ref: '../../responses/errors.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../../responses/errors.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../../responses/errors.yaml#/components/responses/NotFound'
    '409':
      description: Conflict - an item of this supplier still has stock
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/common.yaml#/components/schemas/ErrorResponse'
          example:
            error: conflict
            message: "Cannot delete supplier with linked items"
            timestamp: "2026-07-09T14:30:00Z"
    '500':
      $ref: '../../responses/errors.yaml#/components/responses/InternalServerError'
