get:
  tags:
    - Analytics
  summary: Paginated stock changes for an employee
  description: |
    Pages through individual stock-history rows, optionally filtered by employee
    (createdBy), supplier, and date window. Requires ROLE_ADMIN; readable
    unauthenticated only in demo mode, and a signed-in USER gets 403 (backend
    ADR-0020).
  operationId: getEmployeeChanges
  security:
    - oauth2: [openid]
    - {}
  parameters:
    - name: createdBy
      in: query
      required: false
      schema:
        type: string
    - name: supplierId
      in: query
      required: false
      schema:
        type: string
    - name: startDate
      in: query
      required: false
      schema:
        type: string
        format: date
    - name: endDate
      in: query
      required: false
      schema:
        type: string
        format: date
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
    - name: size
      in: query
      required: false
      description: Page size; values above 100 are clamped to 100
      schema:
        type: integer
        default: 25
        maximum: 100
  responses:
    '200':
      description: Spring Data page of stock-update rows
      content:
        application/json:
          schema:
            type: object
            required:
              - content
              - page
            properties:
              content:
                type: array
                items:
                  $ref: '../../schemas/analytics/analytics.yaml#/components/schemas/StockUpdateResultDTO'
              page:
                $ref: '../../schemas/common/common.yaml#/components/schemas/PageMetadata'
    '400':
      $ref: '../../responses/errors.yaml#/components/responses/ValidationError'
    '401':
      $ref: '../../responses/errors.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../../responses/errors.yaml#/components/responses/Forbidden'
    '500':
      $ref: '../../responses/errors.yaml#/components/responses/InternalServerError'
