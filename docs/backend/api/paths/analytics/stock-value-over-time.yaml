get:
  tags:
    - Analytics
  summary: Get stock value over time
  description: |
    Returns one point per calendar day from start to end: the closing inventory
    value of that day, the sum over items of the quantity held at the end of the
    day times the item's last known unit price. Days without movements carry the
    previous positions forward. Quantities come from each item's whole stock
    history, not only from movements inside the range. An empty array means no
    item has any history up to end. Optional supplier filter.
  operationId: getStockValueOverTime
  security:
    - oauth2: [openid]
  parameters:
    - name: start
      in: query
      required: true
      description: Inclusive start date (ISO yyyy-MM-dd)
      schema:
        type: string
        format: date
      example: "2025-11-01"
    - name: end
      in: query
      required: true
      description: Inclusive end date (ISO yyyy-MM-dd)
      schema:
        type: string
        format: date
      example: "2025-11-30"
    - name: supplierId
      in: query
      required: false
      description: Optional supplier filter
      schema:
        type: string
      example: "supplier-123"
  responses:
    '200':
      description: One closing stock value per calendar day, oldest first
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../schemas/analytics/analytics.yaml#/components/schemas/StockValueOverTimeDTO'
    '400':
      $ref: '../../responses/errors.yaml#/components/responses/ValidationError'
    '401':
      $ref: '../../responses/errors.yaml#/components/responses/Unauthorized'
    '500':
      $ref: '../../responses/errors.yaml#/components/responses/InternalServerError'
