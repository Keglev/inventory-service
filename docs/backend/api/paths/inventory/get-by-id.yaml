get:
  tags:
    - Inventory
  summary: Get inventory item by ID
  description: |
    Retrieves a single inventory item by its unique identifier.
    Includes supplier name and calculated total value.
  operationId: getInventoryItemById
  security:
    - oauth2: [openid]
    - {}
  parameters:
    - $ref: '../../parameters/ids.yaml#/components/parameters/id'
  responses:
    '200':
      description: Inventory item found
      content:
        application/json:
          schema:
            $ref: '../../schemas/inventory/inventory-item.yaml#/components/schemas/InventoryItemDTO'
    '401':
      $ref: '../../responses/errors.yaml#/components/responses/Unauthorized'
    '404':
      $ref: '../../responses/errors.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../responses/errors.yaml#/components/responses/InternalServerError'
