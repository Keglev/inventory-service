patch:
  tags:
    - Inventory
  summary: Adjust inventory quantity
  description: |
    Adjusts the quantity of an inventory item by a delta amount.
    
    **Authorization:** 
    - Requires ROLE_USER or ROLE_ADMIN
    - Anonymous callers get 401: demo mode opens reads only
    
    **Delta Logic:**
    - Positive delta: Add stock (e.g., +50 to increase by 50 units)
    - Negative delta: Remove stock (e.g., -25 to decrease by 25 units)
    
    **Audit Trail:**
    - All quantity changes are logged in stock history
    - Reason parameter is required for compliance tracking
  operationId: adjustInventoryQuantity
  security:
    - oauth2: [openid]
  parameters:
    - $ref: '../../parameters/ids.yaml#/components/parameters/id'
    - name: delta
      in: query
      required: true
      description: Quantity change (positive to add, negative to remove)
      schema:
        type: integer
        format: int32
      example: -25
    - name: reason
      in: query
      required: true
      description: Business reason for quantity adjustment
      schema:
        type: string
        enum:
          - INITIAL_STOCK
          - MANUAL_UPDATE
          - PRICE_CHANGE
          - SOLD
          - SCRAPPED
          - DESTROYED
          - DAMAGED
          - EXPIRED
          - LOST
          - RETURNED_TO_SUPPLIER
          - RETURNED_BY_CUSTOMER
      example: "SOLD"
  responses:
    '200':
      description: Quantity adjusted successfully
      content:
        application/json:
          schema:
            $ref: '../../schemas/inventory/inventory-item.yaml#/components/schemas/InventoryItemDTO'
    '400':
      $ref: '../../responses/errors.yaml#/components/responses/ValidationError'
    '401':
      $ref: '../../responses/errors.yaml#/components/responses/Unauthorized'
    '404':
      $ref: '../../responses/errors.yaml#/components/responses/NotFound'
    '422':
      description: The delta would take the stock below zero
      content:
        application/json:
          schema:
            $ref: '../../schemas/common/common.yaml#/components/schemas/ErrorResponse'
          example:
            error: unprocessable_content
            message: Resulting stock cannot be negative
            timestamp: '2026-11-05T10:30:00Z'
    '500':
      $ref: '../../responses/errors.yaml#/components/responses/InternalServerError'
