patch:
  tags:
    - Inventory
  summary: Update item unit price
  description: |
    Updates the unit price of an inventory item.
    Total value is automatically recalculated (quantity x new price).
    
    **Authorization:** 
    - Requires ROLE_USER or ROLE_ADMIN
    - Anonymous callers get 401: demo mode opens reads only
  operationId: updateInventoryItemPrice
  security:
    - oauth2: [openid]
  parameters:
    - $ref: '../../parameters/ids.yaml#/components/parameters/id'
    - name: price
      in: query
      required: true
      description: New unit price (must be positive)
      schema:
        type: number
        format: double
        minimum: 0
        exclusiveMinimum: true
      example: 34.99
  responses:
    '200':
      description: Price updated successfully
      content:
        application/json:
          schema:
            $ref: '../../schemas/inventory/inventory-item.yaml#/components/schemas/InventoryItemDTO'
    '400':
      $ref: '../../responses/errors.yaml#/components/responses/ValidationError'
    '401':
      $ref: '../../responses/errors.yaml#/components/responses/Unauthorized'
    '404':
      $ref: '../../responses/errors.yaml#/components/responses/NotFound'
    '500':
      $ref: '../../responses/errors.yaml#/components/responses/InternalServerError'
